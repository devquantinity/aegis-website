@media (prefers-color-scheme: dark) {
  :root { --bg:#12161F; --card:#1A202C; --line:#2A3140; --text:#C9CFDB; --muted:#8A93A5; --ink:#0B0F17;
    --crimson:#FF6E9C; --crimson-dk:#FF9BBB;
    --ok:#4FD3A0; --ok-bg:#4FD3A01F; --warn:#E8B45C; --warn-bg:#E8B45C1F; --bad:#FF8A8A; --bad-bg:#FF8A8A1F; }
}
:root[data-theme="dark"] { --bg:#12161F; --card:#1A202C; --line:#2A3140; --text:#C9CFDB; --muted:#8A93A5; --ink:#0B0F17;
  --crimson:#FF6E9C; --crimson-dk:#FF9BBB;
  --ok:#4FD3A0; --ok-bg:#4FD3A01F; --warn:#E8B45C; --warn-bg:#E8B45C1F; --bad:#FF8A8A; --bad-bg:#FF8A8A1F; }
:root[data-theme="light"] { --bg:#F4F4F2; --card:#FFFFFF; --line:#E2E1DC; --text:#2A3140; --muted:#6B7280; --ink:#0E1726;
  --crimson:#C60B46; --crimson-dk:#9E0838;
  --ok:#15704E; --ok-bg:#15704E18; --warn:#8A5A00; --warn-bg:#8A5A001A; --bad:#A80A3B; --bad-bg:#A80A3B14; }

/* ── Colour themes (Hatta, 31 Jul 2026) ────────────────────────────────────
   Every theme is a variable swap only. No screen knows which theme is active,
   so a new theme cannot break a layout.

   The accessibility themes exist because the default palette pairs green for
   good with crimson for bad, and red-green deficiency affects roughly one man
   in twelve. Colour is never the only signal in C360P: every pill carries its
   word, so a theme changes how quickly a state reads, not whether it can be
   read at all. */

/* Colour-safe for red-green deficiency (deuteranopia, protanopia).
   Palette from Okabe and Ito, chosen so every pair stays distinguishable.
   Chrome moves from crimson to blue, because a crimson button next to a red
   error is the exact pair these eyes cannot separate. */
:root[data-theme="cvd-rg"] {
  --crimson:#00508A; --crimson-dk:#003D6B; --ink:#10243A;
  --bg:#F5F5F3; --card:#FFFFFF; --line:#D8D8D4; --text:#1F2530; --muted:#5A6170;
  /* teal, amber and magenta. Vermillion and orange were the original choice and
     they collapse into one another under deuteranopia (measured dE 6). Magenta
     for bad keeps all three separated at dE 21 or better across deuteranopia,
     protanopia and tritanopia, while every pill still clears 4.5:1. */
  --ok:#00695C; --ok-bg:#00695C18; --warn:#7A4F00; --warn-bg:#7A4F001A;
  --bad:#9B0060; --bad-bg:#9B006014;
}

/* Colour-safe for blue-yellow deficiency (tritanopia). Blues read as green and
   yellows wash out, so the palette leans on red, magenta and dark teal. */
:root[data-theme="cvd-by"] {
  --crimson:#7A0030; --crimson-dk:#5C0024; --ink:#1A1017;
  --bg:#F6F4F4; --card:#FFFFFF; --line:#DCD6D8; --text:#241C20; --muted:#635A5E;
  /* teal, purple and red. Measured separation dE 28 or better across all three
     deficiencies, which the previous set did not reach (dE 10). */
  --ok:#00695C; --ok-bg:#00695C18; --warn:#8E44AD; --warn-bg:#8E44AD1F;
  --bad:#B3000F; --bad-bg:#B3000F1A;
}

/* High contrast, for low vision and for glare on a branch counter. */
:root[data-theme="contrast"] {
  --bg:#000000; --card:#0B0B0B; --line:#FFFFFF; --text:#FFFFFF; --muted:#D8D8D8; --ink:#FFFFFF;
  --crimson:#FF5C8A; --crimson-dk:#FF87A8;
  --ok:#4DFFB0; --ok-bg:#4DFFB026; --warn:#FFD166; --warn-bg:#FFD16626;
  --bad:#FF7A7A; --bad-bg:#FF7A7A26;
}
:root[data-theme="contrast"] .card,
:root[data-theme="contrast"] .tablewrap { border-width: 2px; }
:root[data-theme="contrast"] .pill { border-width: 2px; font-weight: 700; }
:root[data-theme="contrast"] .fine { color: #D8D8D8; }
:root[data-theme="contrast"] .nav.active { background: #FFFFFF; color: #000000; }
/* white on the bright accent measures 2.94:1. Near-black on it measures 6.70:1,
   so the button keeps the accent and flips its text instead. */
:root[data-theme="contrast"] .btn.primary,
:root[data-theme="contrast"] .tab.active { color: #000000; font-weight: 700; }
/* the sidebar is brand-coloured by default, which in this theme is a light
   pink carrying white text: unreadable, and this is the theme people choose
   BECAUSE reading is hard. Black with a white edge instead. */
:root[data-theme="contrast"] .sidebar { background: #000000; border-right: 2px solid #FFFFFF; }
:root[data-theme="contrast"] .brand { color: #FFFFFF; border-bottom-color: #FFFFFF; }
:root[data-theme="contrast"] .seg-chip { border-color: #FFFFFF; background: #FFFFFF14; }
:root[data-theme="contrast"] .nav:hover { background: #FFFFFF33; }
:root[data-theme="contrast"] .sidebar-foot { opacity: 1; color: #D8D8D8; }
/* the trace drawer sets its own dark palette, which collides with an already
   black page */
:root[data-theme="contrast"] .trace { background: #000000; border-top-width: 2px; color: #FFFFFF; }
:root[data-theme="contrast"] .trace-toggle .fine,
:root[data-theme="contrast"] .trace-row .fine,
:root[data-theme="contrast"] .trace h4 { color: #D8D8D8; }
:root[data-theme="contrast"] .watermark { opacity: .045; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
/* form controls don't inherit font by default — keeps type consistent across tabs */
button, input, select, textarea { font-family: inherit; }
/* uniform 1.5 line rhythm on all content, every tab */
.content p, .content td, .content th, .content .kv, .content .kv .k, .content .task,
.content .note, .content .fine, .content .dev, .content .prod-row, .content label,
.qa-menu a, .modal label, .modal input, .modal select { line-height: 1.5; }
h1 { font-size: 22px; margin: 0; color: var(--text); }
h2 { font-size: 18px; } h3 { font-size: 14px; margin: 0 0 10px; color: var(--text); }
h3 .fine { font-weight: 400; }
h4 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
a.link { color: var(--crimson); cursor: pointer; text-decoration: underline; font-size: 13px; }
.fine { font-size: 12px; color: var(--muted); } .dim { opacity: .7 } .spacer { flex: 1 }
.warn-t { color: var(--warn); }

/* shell */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 216px; flex-shrink: 0; background: var(--crimson); color: #fff; display: flex; flex-direction: column; padding: 14px 0; position: sticky; top: 0; height: 100vh; }
.brand { cursor: pointer; font-weight: 800; font-size: 20px; letter-spacing: .04em; padding: 4px 18px 16px; border-bottom: 1px solid #ffffff33; margin-bottom: 10px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: #fff; cursor: pointer; font-size: 13.5px; }
.nav:hover { background: #ffffff1c; }
.nav.active { background: #FFFFFF; color: #C60B46; font-weight: 700; }
.nav.off { opacity: .55; cursor: default; }
.nav em { margin-left: auto; font-size: 10px; font-style: normal; border: 1px solid #ffffff77; border-radius: 999px; padding: 0 7px; }
.brand:hover { opacity: .85; }
.sidebar-foot { margin-top: auto; padding: 12px 18px 4px; font-size: 10.5px; opacity: .75; line-height: 1.5; }
.nav-sec { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #ffffff99; padding: 16px 18px 6px; font-weight: 700; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--card); border-bottom: 2px solid var(--line); }
.searchbox { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 640px; }
.searchbox input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13.5px; }
.search-err { color: var(--bad); font-size: 12px; max-width: 300px; }
.topbar-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.counter { cursor: pointer; font-size: 13px; }
.agent { font-size: 13.5px; } .agent em { font-style: normal; color: var(--muted); font-size: 11.5px; }
.notif-pop { position: absolute; right: 16px; top: 52px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 30px #0003; padding: 10px 14px; width: 380px; font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }

.content { padding: 18px 20px 120px; max-width: 1280px; width: 100%; }
.page-title { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }

/* cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* key-value — fixed label column keeps label/info spacing consistent */
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; font-size: 13.5px; align-items: baseline; }
.kv.cols3 { grid-template-columns: repeat(3, 150px 1fr); }
@media (max-width: 1100px) { .kv.cols3 { grid-template-columns: 150px 1fr; } }
.kv .k { color: var(--muted); font-size: 12px; }

/* product summary rows */
.prod-row { display: grid; grid-template-columns: 1fr max-content max-content; gap: 14px; align-items: baseline;
  padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.prod-row:last-of-type { border-bottom: none; }
.prod-row .cnt { min-width: 86px; text-align: right; color: var(--muted); font-size: 12px; }
.prod-row .amt { min-width: 130px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* tabs — prominent section switcher */
.tabs { display: flex; gap: 4px; border-bottom: 3px solid var(--crimson); width: 100%; }
.tab { border: 1px solid var(--line); border-bottom: none; background: var(--bg); color: var(--text); padding: 11px 24px; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: .02em; border-radius: 8px 8px 0 0; }
.tab:hover { background: var(--bad-bg); }
.tab.active { background: var(--crimson); color: #fff; border-color: var(--crimson); box-shadow: 0 -2px 8px #0002 inset; }
.tabs.sub { margin: 10px 0 0; border-bottom: 1px solid var(--line); }
.tabs.sub .tab { font-weight: 500; font-size: 12.5px; padding: 7px 16px; border-radius: 6px 6px 0 0; }
.tabs.sub .tab.active { background: var(--ink); border-color: var(--ink); box-shadow: none; }
/* sticky context header — tabs + buttons + identity strip stay visible while
   scrolling (Izza, 24 Jul); sits under the sticky topbar */
.ctx-sticky { position: sticky; top: 57px; z-index: 25; background: var(--bg); margin: -18px -4px 14px; padding: 12px 4px 0; }
.ctx-head { display: flex; align-items: flex-end; gap: 12px; }
.ctx-head .tabs { flex: 1; }
.id-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.id-strip b { color: var(--ink); }

/* quick action */
.qa-wrap { position: relative; }
.qa-menu { position: absolute; right: 0; top: 40px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 30px #0003; width: 280px; z-index: 40; overflow: hidden; }
.qa-menu a { display: flex; justify-content: space-between; padding: 9px 14px; cursor: pointer; font-size: 13px; color: var(--text); }
.qa-menu a:hover { background: var(--bad-bg); }
.qa-menu em { font-style: normal; font-size: 10.5px; color: var(--muted); }

/* buttons & pills */
.btn { border: 1.5px solid var(--crimson); background: var(--card); color: var(--crimson); border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--crimson); color: #fff; }
.btn.primary:hover { background: var(--crimson-dk); }
.btn.ghost { border-color: var(--line); color: var(--text); }
.btn.sm { padding: 4px 10px; font-size: 12px; } .btn.wide { width: 100%; margin: 14px 0 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.badge { display: inline-block; background: var(--ink); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 8px; }
.badge.bad { background: var(--bad); }
.unmask { border: none; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); }
.unmask:hover { color: var(--crimson); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; background: var(--bg); }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { text-align: right; }
.dr { color: var(--bad); } .cr { color: var(--ok); }

/* summary boxes (wireframe: Account Summary counts) */
.sumrow { display: flex; gap: 12px; flex-wrap: wrap; }
.sumbox { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; text-align: center; min-width: 110px; }
.sumbox b { display: block; font-size: 22px; color: var(--crimson); }
.sumbox span { font-size: 11.5px; color: var(--muted); }

/* tasks, notes, devices */
.task { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.task.click { cursor: pointer; } .task.click:hover { border-color: var(--crimson); }
.task-actions { display: flex; gap: 8px; margin-top: 8px; }
.note { background: var(--warn-bg); border-left: 3px solid var(--warn); border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
.dev { padding: 8px 0; border-bottom: 1px dashed var(--line); } .dev:last-of-type { border-bottom: none; }
.mini-prof { padding: 10px 16px; font-size: 13px; }
/* spec CCW-C360-CO BR2: profile section stays fixed at top while navigating */
.sticky-prof { position: sticky; top: 58px; z-index: 20; box-shadow: 0 4px 14px #0001; }
.banner { border-radius: 8px; padding: 10px 16px; margin-bottom: 12px; font-size: 13.5px; }
.banner.bad-b { background: var(--bad-bg); border: 1px solid var(--bad); }
.banner.warn-b { background: var(--warn-bg); border: 1px solid var(--warn); }

/* filter bar (wireframe: From/to date + type + Search + Sort By) */
.filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.filterbar input, .filterbar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 12.5px; }

/* customer details — servicing-flow grouping */
.status-band { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin: 4px 0 16px; }
.detail-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1000px) { .detail-groups { grid-template-columns: 1fr; } }
.dgroup { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.dgroup h4 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--crimson); margin: 0 0 10px; }
.dgroup .kv { grid-template-columns: 190px 1fr; }
.trv { font-size: 15px; }

/* Update Customer Information — a mirror of the Customer Details layout with an
   edit affordance. Read-only rows are dimmed on purpose: the field is visible
   but is not the agent's to change. */
.dgroup h5.sub-h { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.dgroup h5.sub-h:first-of-type { border-top: none; padding-top: 0; }
.kv .ro { color: var(--muted); }
.kv .editable { display: flex; flex-direction: column; gap: 3px; }
.kv .editable input, .kv .editable select { width: 100%; max-width: 340px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; }
.kv .editable input:focus, .kv .editable select:focus { border-color: var(--crimson); outline: none; }
.kv .chg { display: flex; flex-direction: column; gap: 2px; }
.kv .chg .new-v { color: var(--crimson); }

.addr-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.addr-row:last-of-type { border-bottom: none; }
.addr-row .pill { flex-shrink: 0; min-width: 108px; text-align: center; }

/* The dark and high-contrast brand colours are light, so anything sitting ON
   them needs dark text. The sidebar keeps a deep crimson of its own rather than
   inheriting the light accent. */
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .tab.active { color: #0B0F17; font-weight: 700; }
:root[data-theme="dark"] .sidebar { background: #7E0C2E; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .btn.primary,
  :root:not([data-theme]) .tab.active { color: #0B0F17; font-weight: 700; }
  :root:not([data-theme]) .sidebar { background: #7E0C2E; }
}

/* segment chip at the head of the sidebar: what scopes everything below it */
.seg-chip { margin: 0 12px 10px; padding: 8px 12px; border: 1px solid #ffffff44; border-radius: 8px;
  background: #ffffff14; display: flex; flex-direction: column; gap: 1px; }
.seg-chip .fine { color: #ffffffaa; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.seg-chip b { font-size: 14px; }
.seg-chip.none { opacity: .7; }
.seg-change { font-size: 11px; color: #fff; text-decoration: underline; cursor: pointer; margin-top: 2px; }
.session-warn { color: var(--bad); font-weight: 700; }
.theme-pick { font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); max-width: 190px; }

/* copy blocked, paste allowed: text is unselectable outside form fields */
.content, .topbar, .trace-drawer { -webkit-user-select: none; user-select: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }

/* screen-capture deterrence: watermark, blur-on-blur, no printing */
.watermark { position: fixed; inset: 0; z-index: 200; pointer-events: none; overflow: hidden;
  display: flex; flex-wrap: wrap; gap: 70px 46px; transform: rotate(-24deg) scale(1.6); opacity: .032; }
.watermark span { font-size: 12px; white-space: nowrap; font-family: var(--mono); }
.shield-msg { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 6px; background: var(--bg); text-align: center; }
body.shielded .shell { filter: blur(18px); }
body.shielded .shield-msg { display: flex; }
@media print { body { display: none !important; } }

/* access matrix (features x group roles) */
table.matrix td, table.matrix th { text-align: center; }
table.matrix td:first-child, table.matrix th:first-child { text-align: left; }
.matrix-sec td { background: var(--bg); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--crimson); font-weight: 700; }
.ynCell { cursor: pointer; }
.ynCell:hover { background: var(--bad-bg); }
.yn { display: inline-block; min-width: 22px; border-radius: 4px; font-weight: 700; font-size: 12px; padding: 1px 6px; }
.yn.yes { color: var(--ok); background: var(--ok-bg); }
.yn.no { color: var(--muted); background: transparent; }
.chkrow { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 8px; }

/* full-screen servicing forms */
.dgroup.wide { grid-column: 1 / -1; }
.remarks { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 13.5px; line-height: 1.5; resize: vertical; min-height: 150px; }
.remarks:focus { outline: none; border-color: var(--crimson); }
.wc { margin-top: 4px; text-align: right; font-variant-numeric: tabular-nums; }
.opf, .opf-file { padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 13.5px; }
.opf:focus { outline: none; border-color: var(--crimson); }
.note.bad-b { background: var(--bad-bg); border-left-color: var(--bad); }

.proto-panel { border-style: dashed; }
.proto-panel .tablewrap { border-style: dashed; }

/* segment gate — Consumer live, rest disabled (out of P1 scope) */
.seg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 12px; }
.seg-tile { border: 1.5px solid var(--line); border-radius: 10px; padding: 20px 16px; text-align: center; cursor: pointer; background: var(--bg); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.seg-tile:hover { border-color: var(--crimson); box-shadow: 0 4px 16px #0001; }
.seg-tile.off { opacity: .45; cursor: not-allowed; filter: grayscale(1); }
.seg-tile.off:hover { border-color: var(--line); box-shadow: none; }
.seg-icon { font-size: 30px; line-height: 1; }
.seg-name { font-weight: 700; font-size: 15px; }

/* pager */
.pager { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.pager .btn[disabled] { opacity: .4; cursor: default; }

/* modal */
.overlay { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--card); border-radius: 12px; padding: 22px 24px; width: min(520px, 92vw); max-height: 86vh; overflow-y: auto; }
.modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.modal input, .modal select { width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13.5px; }
/* checkboxes must not stretch — fixes group-assignment / permission-matrix alignment */
.modal input[type="checkbox"] { width: 16px; height: 16px; padding: 0; margin: 0; flex-shrink: 0; accent-color: var(--crimson); vertical-align: middle; }
.modal .chk { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; color: var(--text); }
.modal table td, .modal table th { text-align: center; }
.modal table td:first-child, .modal table th:first-child { text-align: left; white-space: nowrap; }

/* login */
.login-wrap { display: flex; min-height: 100vh; }
.login-hero { flex: 1.2; background: linear-gradient(160deg, var(--crimson), #5E0521); color: #fff; padding: 60px 56px; display: flex; flex-direction: column; justify-content: center; }
.login-logo { font-size: 26px; font-weight: 800; letter-spacing: .02em; margin-bottom: 28px; } .login-logo span { font-weight: 300; }
.login-hero h1 { font-size: 30px; color: #fff; margin-bottom: 14px; max-width: 480px; }
.login-hero p { max-width: 460px; opacity: .92; }
.login-illus { font-size: 42px; margin: 26px 0; }
.login-hero .fine { color: #ffffffaa; margin-top: auto; }
.login-panel { flex: 1; background: var(--card); padding: 60px 56px; display: flex; flex-direction: column; justify-content: center; max-width: 480px; }
.login-links { font-size: 12.5px; margin-bottom: 26px; } .login-links a { color: var(--crimson); }
.login-panel label { font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.login-panel input, .login-panel select { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; }
.login-panel .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--text); }
.sec-indicators { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 26px; font-size: 11.5px; color: var(--muted); }

/* trace drawer */

// Name-search demo set (Jacky, 30 Jul 2026). Three generated customers are
// renamed to his worked example so the ranking tiers can actually be walked:
// searching "Ahmad Ali" must return the exact match first, then the name that
// starts with the keyword, then the one that merely contains it. Without these
// the ranking is only assertable in code, not on screen.
(function seedNameSearchExample() {
  const demo = ["AHMAD ALI", "AHMAD ALIAS BIN OSMAN", "WAN AHMAD ALI BIN ZAKARIA"];
  const targets = CUSTOMERS.filter(c => c.staffTag !== "Yes").slice(-3);
  targets.forEach((c, i) => {
    if (!demo[i]) return;
    c.name = demo[i];
    c.accounts.forEach(a => { a.holder = demo[i]; a.holders = [demo[i]]; });
    c.cards.forEach(cd => { cd.holder = demo[i]; });
  });
})();

function trace(tcKey, extra) {

  state.trace.unshift({

    hops: `SPA → ALB → c360p-app :: ${tcKey === "zendesk" ? "case" : tcKey === "keycloak" ? "authz" : tcKey.startsWith("card") || tcKey.includes("Card") ? "card" : tcKey.startsWith("sa") || tcKey.startsWith("ca") || tcKey === "acctSummary" ? "account" : "customer360"} module → ${t.sys.includes("Zendesk") || t.sys.includes("Keycloak") || t.sys.includes("cmp") || t.sys.includes("notification") ? t.sys : "c360p-host-adapter → " + t.sys}`,
  });
  if (state.trace.length > 60) state.trace.pop();

// ── audit module (append-only; reads are PDPA events) ──
function audit(type, detail, opts) {
  state.auditLog.unshift({
    time: nowStr(), type, detail,
    // a group-role-only user has no legacy role code, so name the group role
    actor: state.user
      ? `${state.user.fullName} (${state.user.roleCode !== "NONE" ? state.user.roleCode : (state.user.groupRoleNames || []).join(", ") || "NONE"})`
      : "anonymous",
    cif: (opts && opts.cif) || (state.customer && state.customer.cif) || "—",
    just: (opts && opts.just) || "",
    module: (opts && opts.module) || currentModule(),
  });
}

// ── authz module: RBAC + Maker-Checker engine ──
// Effective access = union of module permissions from all ACTIVE roles
// reachable through the user's groups (Role Management model, G-1).
// roleCode is DERIVED from permissions for display/back-compat:
//   admin perms → SUPER_ADMIN · audit-view + no servicing → COMPLIANCE ·
//   any Approve → CHECKER_L2 · any Create/Edit → MAKER · View only → VIEWER.
function userRoles(staff) {
  const gids = staff.groups || [];
  return ROLES.filter(r => r.status === "Active" && r.groups.some(g => gids.includes(g)));
}

function unionPerms(roles) {
  const p = {};
  for (const r of roles) for (const [m, lvls] of Object.entries(r.perms || {})) {
    p[m] = [...new Set([...(p[m] || []), ...lvls])];
  }
  return p;
}

function deriveRoleCode(perms) {
  const has = (m, l) => (perms[m] || []).includes(l);
  const servicing = ["c360", "casaia", "cards", "cases"].some(m => has(m, "Create") || has(m, "Edit"));
  const approve = Object.keys(perms).some(m => has(m, "Approve"));
  if (Object.keys(perms).some(m => m === "admin" && (perms[m] || []).length)) return "SUPER_ADMIN";
  if (!servicing && has("audit", "View")) return "COMPLIANCE";
  if (approve) return "CHECKER_L2";
  if (servicing) return "MAKER";
  if (Object.keys(perms).length) return "VIEWER";
  return "NONE";
}

function resolveAccess(staff) {
  const gs = GROUPS.filter(g => (staff.groups || []).includes(g.id));
  const roles = userRoles(staff);
  const perms = unionPerms(roles);
  const roleCode = gs.length ? deriveRoleCode(perms) : "NONE";
  const gr = resolveGroupRoles(staff);
  if (roleCode === "NONE") return { roleCode: "NONE", scope: null, perms: {}, roleNames: [], ...gr };
  const scope = gs.some(g => g.scope === "ALL") ? "ALL" : gs[0].scope;
  return { roleCode, scope, perms, roleNames: roles.map(r => r.name), ...gr };
}

// ── Group Role resolution (Faie, 30 Jul 2026) ──────────────────────────────
// Effective features and segments are the UNION across the user's ACTIVE group
// roles. Union, not intersection: holding a second group role can only ever add
// access, which is what an admin assigning two roles expects to happen.
// Default-deny throughout: a user with no group role reaches nothing.
function userGroupRoles(staff) {
  const ids = staff.groupRoles || [];
  return GROUP_ROLES.filter(g => g.status === "Active" && ids.includes(g.id));
}
function resolveGroupRoles(staff) {
  const grs = userGroupRoles(staff);
  const features = {}, segments = {};
  for (const g of grs) {
    for (const [f, on] of Object.entries(g.features || {})) if (on) features[f] = true;
    for (const [s, on] of Object.entries(g.segments || {})) if (on) segments[s] = true;
  }
  return {
    features, segments,
    groupRoleNames: grs.map(g => g.name),
    grAdmin: grs.some(g => g.admin),
  };
}
// One place every screen asks "may this user see this". An inactive user is
// refused everything: status is checked here rather than only at login, so
// deactivating someone mid-session takes effect on the next render.
function can(featureId) {
  if (!state.user) return false;
  if (state.user.status === "Inactive") return false;
  return !!(state.user.features || {})[featureId];
}
function canSegment(seg) { return !!((state.user && state.user.segments) || {})[seg]; }

// The Quick Action catalogue is keyed by opKey, the feature matrix by
// "svc.<opKey>". A service the matrix does not list at all (card and account
// operations, audit export) is not governed by it and stays with the older
// role permissions, rather than silently disappearing for everyone.
function canService(opKey) {
  const fid = "svc." + opKey;
  if (!FEATURE_IDS.includes(fid)) return true;
  return can(fid);
}

// ── Group Role administration ──────────────────────────────────────────────
function grMembers(grId) {
  return Object.values(STAFF).filter(u => (u.groupRoles || []).includes(grId));
}
function grSave(id, data) {
  if (!data.name) return { error: "Group role name is required." };
  const dup = GROUP_ROLES.find(g => g.id !== id && g.name.toLowerCase() === data.name.toLowerCase());
  if (dup) return { error: "A group role with this name already exists." };
  if (!Object.values(data.segments || {}).some(Boolean)) return { error: "Assign at least one segment." };
  let g = id ? GROUP_ROLES.find(x => x.id === id) : null;
  if (g) {
    Object.assign(g, data);
    audit("ACL_CHANGE", `Group role "${g.name}" updated: segments [${segList(g)}], ${Object.values(g.features || {}).filter(Boolean).length} feature(s), status ${g.status}`, { module: "platform" });
  } else {
    g = { id: "gr-" + data.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24), status: "Active", ...data };
    GROUP_ROLES.push(g);
    audit("ACL_CHANGE", `Group role "${g.name}" created: segments [${segList(g)}], ${Object.values(g.features || {}).filter(Boolean).length} feature(s)`, { module: "platform" });
  }
  refreshSessionAccess();
  notify(`Group role saved: ${g.name}`);
  return { ok: g };
}
function segList(g) { return SEGMENTS_LOB.filter(s => (g.segments || {})[s]).join(", ") || "none"; }

function grDelete(id) {
  const g = GROUP_ROLES.find(x => x.id === id);
  const members = grMembers(id);
  if (members.length) { notify(`Cannot delete "${g.name}": ${members.length} member(s) still assigned. Remove them first.`); return false; }
  GROUP_ROLES.splice(GROUP_ROLES.indexOf(g), 1);
  audit("ACL_CHANGE", `Group role "${g.name}" deleted`, { module: "platform" });
  notify(`Group role deleted: ${g.name}`);
  return true;
}

function grToggleFeature(grId, featureId) {
  const g = GROUP_ROLES.find(x => x.id === grId);
  const now = !g.features[featureId];
  if (now) g.features[featureId] = true; else delete g.features[featureId];
  const label = (FEATURE_CATALOGUE.flatMap(x => x.items).find(i => i.id === featureId) || {}).label || featureId;
  audit("ACL_CHANGE", `Feature access "${label}" ${now ? "granted to" : "revoked from"} group role "${g.name}"`, { module: "platform" });
  refreshSessionAccess();
  render();
}

function grToggleSegment(grId, seg) {
  const g = GROUP_ROLES.find(x => x.id === grId);
  g.segments[seg] = !g.segments[seg];
  audit("ACL_CHANGE", `Segment "${seg}" ${g.segments[seg] ? "granted to" : "revoked from"} group role "${g.name}"`, { module: "platform" });
  refreshSessionAccess();
  render();
}

function grRemoveMember(grId, userId) {
  const u = STAFF[userId], g = GROUP_ROLES.find(x => x.id === grId);
  if (userId === state.user.id) { notify("Blocked: you cannot remove yourself from a group role (lockout guard)."); return false; }
  u.groupRoles = (u.groupRoles || []).filter(x => x !== grId);
  u.lastModified = nowStr();
  audit("ACL_CHANGE", `${u.fullName} removed from group role "${g.name}". Remaining: ${(u.groupRoles || []).length ? u.groupRoles.map(grName).join(", ") : "none"}`, { module: "platform" });
  notify(`${u.name} removed from ${g.name}`);
  return true;
}
function grName(id) { const g = GROUP_ROLES.find(x => x.id === id); return g ? g.name : id; }

function setUserGroupRoles(userId, ids, note) {
  const u = STAFF[userId];
  if (userId === state.user.id) { notify("Blocked: cannot modify your own access (self-escalation / lockout guard)."); return false; }
  const before = (u.groupRoles || []).map(grName).join(", ") || "none";
  u.groupRoles = ids;
  u.lastModified = nowStr();
  audit("ACL_CHANGE", `${u.fullName} group roles [${before}] to [${ids.map(grName).join(", ") || "none"}]${note ? " · " + note : ""}`, { module: "platform" });
  notify(`Access updated: ${u.name}`);
  return true;
}

function setUserStatus(userId, status) {
  const u = STAFF[userId];
  if (userId === state.user.id) { notify("Blocked: cannot change your own status (lockout guard)."); return false; }
  u.status = status;
  u.lastModified = nowStr();
  audit("ACL_CHANGE", `${u.fullName} status set ${status}`, { module: "platform" });
  notify(`${u.name} → ${status}`);
