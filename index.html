// AD-master (D-09): the identity is copied from AD, never invented here.
function addUserFromAD(adId, groupRoleIds) {
  const ad = AD_DIRECTORY.find(x => x.id === adId);
  if (!ad) return { error: "Select a user from the Active Directory list." };
  if (STAFF[adId]) return { error: `${ad.fullName} already has a C360P account.` };
  STAFF[adId] = {
    id: ad.id, name: ad.fullName.split(" ")[0], fullName: ad.fullName,
    role: "—", unit: ad.unit, email: ad.email, dept: ad.dept,
    adSynced: ad.adSynced, groups: [], groupRoles: groupRoleIds || [],
    status: "Active", lastLogin: "—", lastModified: nowStr(),
  };
  audit("ACL_CHANGE", `User added from Active Directory: ${ad.fullName} (${ad.email}), group roles [${(groupRoleIds || []).map(grName).join(", ") || "none"}]`, { module: "platform" });
  notify(`User added: ${ad.fullName}`);
  return { ok: STAFF[adId] };
}

// An access change must show up for the signed-in user immediately, otherwise
// the admin sees the matrix say one thing and the screens do another.
function refreshSessionAccess() {
  if (!state.user) return;
  const staff = STAFF[state.user.id];
  if (staff) Object.assign(state.user, resolveAccess(staff), { status: staff.status });
}

// ── Role Management CRUD (spec: Create User Roles; Super Admin only) ────────
function roleMembers(role) {
  return Object.values(STAFF).filter(u => (u.groups || []).some(g => role.groups.includes(g)));
}

function roleSave(id, data) {
  // validations per spec — exact messages
  if (!data.name) return { error: "Role name is required." };
  if (!data.groups.length) return { error: "At least one group must be assigned." };
  if (!Object.keys(data.perms).length) return { error: "At least one module permission must be assigned." };
  const dup = ROLES.find(r => r.id !== id && r.name.toLowerCase() === data.name.toLowerCase() && r.groups.some(g => data.groups.includes(g)));
  if (dup) return { error: "Role name already exists in the selected group." };
  let r = id ? ROLES.find(x => x.id === id) : null;
  if (r) {
    Object.assign(r, data);
    audit("ACL_CHANGE", `Role Management: role "${r.name}" updated — groups [${r.groups.join(", ")}], modules [${Object.keys(r.perms).join(", ")}], status ${r.status}`, { module: "platform" });
  } else {
    r = { id: "r-" + data.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24), ...data };
    ROLES.push(r);
    audit("ACL_CHANGE", `Role Management: role "${r.name}" created — groups [${r.groups.join(", ")}], modules [${Object.keys(r.perms).join(", ")}], status ${r.status}`, { module: "platform" });
  }
  notify(`Role saved: ${r.name}`);   // spec: confirmation message on success
  return { ok: r };
}

function roleDelete(id) {
  const r = ROLES.find(x => x.id === id);
  if (r.status === "Active" && roleMembers(r).length) {
    notify("Role cannot be deleted as it is assigned to active users.");
    return false;
  }
  ROLES.splice(ROLES.indexOf(r), 1);
  audit("ACL_CHANGE", `Role Management: role "${r.name}" deleted`, { module: "platform" });
  notify(`Role deleted: ${r.name}`);
  return true;
}

function roleToggleStatus(id) {
  const r = ROLES.find(x => x.id === id);
  r.status = r.status === "Active" ? "Inactive" : "Active";
  // spec: permission changes reflect immediately for assigned users
  if (state.user) { const acc = resolveAccess(state.user); Object.assign(state.user, acc); }
  audit("ACL_CHANGE", `Role Management: role "${r.name}" set ${r.status}`, { module: "platform" });
  notify(`${r.name} → ${r.status}`);
  render();
}

function login(staffId) {
  const staff = STAFF[staffId];
  const acc = resolveAccess(staff);
  state.user = { ...staff, ...acc };
  state.sessionExpired = false;
  touchSession();
  if (staff.status === "Inactive") {
    audit("AUTH", `Login DENIED — ${staff.fullName} is Inactive in UAM`, { module: "authz" });
    state.loginInactive = true;
    return false;
  }
  state.loginInactive = false;
  // Entry depends on group roles, not on the older local groups. A user created
  // through Add from AD holds group roles and no local group, and refusing them
  // would make the new model unusable on its own.
  if (!(acc.groupRoleNames || []).length) {
    audit("AUTH", `Login DENIED — AD user ${staff.fullName} has no group role assignment`, { module: "authz" });
    return false;
  }
  staff.lastLogin = nowStr();
  trace("keycloak", `OIDC token issued — groups → ${acc.roleCode}`);
  audit("AUTH", `Login via Keycloak SSO (corporate AD) — role ${acc.roleCode}, scope ${acc.scope}`);
  notify(`Welcome, ${state.user.name}. Session started ${nowStr()}.`);
  return true;
}

// ── UAM mutations — direct commit, NO maker-checker (Atie + Ciya 2026-07-17),
// every change audited as ACL_CHANGE. Guard: admin cannot edit own access.
function uamSetUserAccess(userId, groupIds, note) {
  if (userId === state.user.id) { notify("Blocked: cannot modify your own access (self-escalation/lockout guard)."); return false; }
  const u = STAFF[userId];
  const before = (u.groups || []).join(", ") || "(none)";
  u.groups = groupIds;
  const after = groupIds.join(", ") || "(none)";
  const eff = resolveAccess(u);
  audit("ACL_CHANGE", `UAM: ${u.fullName} groups [${before}] → [${after}] — effective role ${eff.roleCode}, scope ${eff.scope || "—"}${note ? " · " + note : ""}`, { module: "platform" });
  notify(`Access updated: ${u.name} → ${ROLE_LABELS[eff.roleCode]}`);
  return true;
}

function uamSaveGroup(id, name, scope, desc) {
  let g = GROUPS.find(x => x.id === id);
  if (g) {
    audit("ACL_CHANGE", `UAM: group "${g.name}" updated → scope ${scope}`, { module: "platform" });
    Object.assign(g, { name, scope, desc });
  } else {
    g = { id: "g-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24), name, scope, desc };
    GROUPS.push(g);
    audit("ACL_CHANGE", `UAM: group "${name}" created — scope ${scope}`, { module: "platform" });
  }
  notify(`Group saved: ${name}`);
  return g;
}

function uamDeleteGroup(id) {
  const g = GROUPS.find(x => x.id === id);
  const members = Object.values(STAFF).filter(u => (u.groups || []).includes(id));
  if (members.length) { notify(`Blocked: "${g.name}" still has ${members.length} member(s). Remove members first.`); return false; }
  GROUPS.splice(GROUPS.indexOf(g), 1);
  audit("ACL_CHANGE", `UAM: group "${g.name}" deleted`, { module: "platform" });
  notify(`Group deleted: ${g.name}`);
  return true;
}

// opts.status parks the request instead of routing it to a checker. Used by
// CCW-OAA-01 AC4: an overseas request with incomplete documents becomes
// Pending Customer Action, which is a real waiting state and not an approval.
// opts.level overrides the catalogue level for a single request. Used by Update
// Customer Information, where the checker requirement is per field: the fields
// Jacky's matrix marks FALSE go in as L0 and execute on submit.
function submitOp(opKey, summary, formData, opts) {
  const op = OPS_CATALOGUE[opKey];
  const parked = opts && opts.status;
  const level = (opts && opts.level) || op.level;
  const item = {
    id: "MC-" + (++state.opSeq), opKey, op: op.label, level,
    summary, formData,
    cif: (!op.platform && state.customer) ? state.customer.cif : "—",
    custName: (!op.platform && state.customer) ? state.customer.name : "(platform-level)",
    maker: state.user.fullName, makerId: state.user.id, submitted: nowStr(),
    status: level === "L0" ? "EXECUTED" : "PENDING",
    custApproval: !!op.custApproval, custApproved: false,
  };
  if (parked) {
    item.status = opts.status;
    state.pendingOps.unshift(item);
    audit("MC_SUBMIT", `${op.label} parked as ${opts.status} — ${summary}`);
    notify(`${op.label} ${opts.status.replace(/_/g, " ").toLowerCase()} — ${item.id}`);
    return item;
  }
  if (level === "L0") {
    executeOp(item);
  } else {
    state.pendingOps.unshift(item);
    audit("MC_SUBMIT", `${op.label} submitted for approval (${level}) — ${summary}`);
    notify(`${op.label} pending ${level} approval — ${item.id}`);
  }
  return item;
}

// ── Online banking profile and challenge question ──────────────────────────
// Neither is in the seed data, so both are derived on first read and then kept
// on the customer so an execution survives re-render. A customer who has never
// logged in has no online profile, which is what makes CCW-SVC-05 AC10
// (nothing to delete) reachable in the prototype instead of theoretical.
function onlineProfile(c) {
  if (!c.online) {
    c.online = {
      id: "IB" + c.cif,
      status: (c.lastLogin && c.lastLogin !== "—") ? "Active" : "Inactive",
    };
  }
  return c.online;
}
function challengeQuestion(c) {
  if (!c.challengeQ) c.challengeQ = { set: onlineProfile(c).status === "Active", reset: null };
  return c.challengeQ;
}

// Spec CCW-C360-CO BR3: risk fields visible to Level 2 = holders of any
// Approve permission. BR8: contact number formatted XXX-XXXXXXX.
function permHas(mod, lvl) { return state.user && ((state.user.perms || {})[mod] || []).includes(lvl); }
function canSeeRisk() { return state.user && Object.keys(state.user.perms || {}).some(m => permHas(m, "Approve")); }
function fmtPhone(v) {
  const s = String(v || "").replace(/\D/g, "");
  return s.length >= 9 ? s.slice(0, 3) + "-" + s.slice(3) : (v || "—");
}

// role helpers — all derived from the union permission matrix (G-1 model)
// Servicing capability now comes from the feature matrix first. The older
// module permissions remain the fallback for users who predate group roles and
// for the modules the matrix does not list.
function isServicing() {
  if (!state.user) return false;
  if (SERVICE_FEATURES.some(f => can(f)) || SERVICE_FEATURES.some(f => can(f + APPROVE_SUFFIX))) return true;
  return ["c360", "casaia", "cards", "cases"].some(m => permHas(m, "Create") || permHas(m, "Edit"));
}
function canViewAudit() { return permHas("audit", "View"); }
function isSuperAdmin() { return !!(state.user && (state.user.grAdmin || (((state.user.perms || {}).admin) || []).length > 0)); }
// Customer 360 and its activity tabs are in the feature matrix. CASAIA, Cards
// and Case Management are not, so they stay on the older permissions until the
// BA settles what governs them (Spec Gap raised 30 Jul 2026).
const TAB_FEATURE = { overview: "c360", audittrail: "c360", custaudit: "c360" };
function hasProduct(tab) {
  const f = TAB_FEATURE[tab];
  if (f) return can(f);
  return permHas(TAB_MODULE[tab] || tab, "View");
}
// service visible = permission (servicing role + tab) AND feature flag ON
function serviceOn(opKey) { return FEATURE_FLAGS[opKey] !== false; }

function toggleFlag(k) {
  FEATURE_FLAGS[k] = !FEATURE_FLAGS[k];
  audit("ACL_CHANGE", `Feature flag "${OPS_CATALOGUE[k] ? OPS_CATALOGUE[k].label : k}" → ${FEATURE_FLAGS[k] ? "ON" : "OFF"}`, { module: "platform" });
  notify(`Flag ${k} → ${FEATURE_FLAGS[k] ? "ON" : "OFF"}`);
  render();
}

// module context for audit tagging
function currentModule() {
  if (state.moduleView === "audit" || state.moduleView === "acl") return "platform";
  if (!state.customer) return "platform";
  return { overview: "customer360", casaia: "casaia", cards: "cards", cases: "cases", audittrail: "customer360", custaudit: "customer360" }[state.tab] || "platform";
}

// Approval right now comes from the same matrix as everything else (decision
// 30 Jul 2026). A service the matrix does not cover falls back to the older
// module permissions, so card and account operations keep working while the
// two models are being merged.
function canApproveService(opKey) {
  const fid = "svc." + opKey + APPROVE_SUFFIX;
  if (!FEATURE_IDS.includes(fid)) return null;
  return can(fid);
}

function canApprove(item) {
  if (!state.user) return false;
  if (state.user.id === item.makerId) return false;            // maker ≠ checker
  const viaMatrix = canApproveService(item.opKey);
  if (viaMatrix !== null) return viaMatrix;
  // approval right = Approve permission on any servicing module (G-1 matrix)
  return ["c360", "casaia", "cards", "cases"].some(m => permHas(m, "Approve"));
}

function approveOp(id, decision, remark) {
  const item = state.pendingOps.find(o => o.id === id);
  if (!item) return;
  if (decision === "APPROVE") {
    if (item.custApproval && !item.custApproved) {
      item.status = "AWAITING_CUSTOMER";
      trace("cmp", `Customer approval request pushed to ${item.custName}'s device`);
      audit("MC_APPROVE", `${item.op} approved by checker — awaiting customer approval via cmp (I-05)`);
      // simulate customer approving on their phone after a beat
      setTimeout(() => {
        item.custApproved = true;
        // customer's approval is a CUSTOMER action — goes to customer activity log
        const act = CUST_ACTIVITY[item.cif] || (CUST_ACTIVITY[item.cif] = []);
        act.unshift({ time: nowStr(), action: "Approval", channel: "Mobile App (cmp)", detail: `Customer approved: ${item.op} — ${item.summary}`, module: "customer360" });
        executeOp(item);
        render();
      }, 2500);
    } else {
      executeOp(item);
    }
  } else {
    item.status = "REJECTED"; item.decided = nowStr(); item.checker = state.user.fullName; item.remark = remark || "";
    audit("MC_REJECT", `${item.op} rejected — ${remark || "no remark"}`, { cif: item.cif });
    notify(`${item.id} rejected by ${state.user.name}`);
  }
}

function executeOp(item) {
  item.status = "EXECUTED"; item.decided = nowStr();
  if (state.user && state.user.id !== item.makerId) item.checker = state.user.fullName;
  // host write fires only after approval — apply visible effects
  const cust = CUSTOMERS.find(c => c.cif === item.cif);
  if (item.opKey === "detailsUpdate" && cust && item.formData.changes) {
    // multi-field update: apply every changed field in one pass. Address parts
    // are collected per type first, because five separate writes to the same
    // flat address line would each overwrite the previous one.
    const addrEdits = {};
    for (const [fld, val] of Object.entries(item.formData.changes)) {
      const am = ADDR_FIELD_MAP[fld];
      if (am) { (addrEdits[am[0]] = addrEdits[am[0]] || {})[am[1]] = val; continue; }
      if (fld === "Phone No3 (H/P)") cust.mobile = val;
      else if (fld === "Email Address") cust.email = val;
      else if (fld === "PDPA Consent") cust.pdpa = val;
      else if (fld === "Vulnerability Status") cust.vulnerability = val;
      else if (fld === "OKU Number") {
        // the OKU number lives inside the vulnerability string, so it is only
        // meaningful once the status itself says OKU
        const status = item.formData.changes["Vulnerability Status"] || cust.vulnerability;
        if (String(status).startsWith("OKU")) cust.vulnerability = `OKU (${val})`;
      } else {
        if (!cust.detailsExtra) cust.detailsExtra = {};
        cust.detailsExtra[fld] = val;
      }
      cust.notes.unshift({ date: nowStr(), detail: `${fld} updated to "${val}" (${item.id})` });
    }
    for (const [type, parts] of Object.entries(addrEdits)) {
      const merged = joinAddr({ ...addrParts(cust, type), ...parts });
      cust.addresses = cust.addresses || [];
      const row = cust.addresses.find(r => r.type === type);
      if (row) row.addr = merged; else cust.addresses.push({ type, addr: merged });
      if (type === "Residential") cust.address = merged;
      cust.notes.unshift({ date: nowStr(), detail: `${type} address updated to "${merged}" (${item.id})` });
    }
    trace("profile", `CIF UPDATE — ${Object.keys(item.formData.changes).length} field(s) written to CBS`);
  }
  if (item.opKey === "killSwitch" && cust) {
    // CCW-KS-01 BR3: the block is not scoped. It covers the user ID and every
    // applicable online transaction access, including cards, CASAIA and any
    // other online service configured for the customer. The scope picker that
    // used to be on this form was removed (Faie, 28 Jul 2026): letting an agent
    // deselect part of the block turns an emergency action into a partial one.
    const scope = "User ID, Cards, CASAIA, all other configured online transaction services";
    cust.killswitch = "Yes"; cust.status = "Suspended";
    onlineProfile(cust).status = "Blocked";
    cust.cards.forEach(cd => { if (cd.status === "Active") { cd.status = "Blocked"; cd.reasonCode = `KS (${item.formData["Request Reference No."] || item.id})`; pushCardTrail(cd, "Blocked", cd.reasonCode); } });
    cust.notes.unshift({ date: nowStr(), detail: `KILL SWITCH EXECUTED: ${item.formData["Reason for Kill Switch"] || item.formData["Reason Code"] || ""}. Blocked ${scope}. Completed ${nowStr()} (${item.formData["Request Reference No."] || item.id}). Reactivation via separate authorised process.` });
    trace("pdpa", "TC 9089 KILL SWITCH UPD: KILSTS set");
    audit("EXECUTE", `${item.formData["Request Reference No."] || item.id}: blocked ${scope}. Completed ${nowStr()}. Supervisor Notification Status: Sent`, { cif: item.cif });
  }
  if (item.opKey === "reactivation" && cust) {
    cust.killswitch = "No"; cust.status = "Active";
    cust.notes.unshift({ date: nowStr(), detail: `Account reactivated — ${item.formData["Reason Code"] || ""} (via C360P, ${item.id})` });
    trace("pdpa", "TC 9089 KILL SWITCH UPD — KILSTS cleared");
  }
  // CCW-SVC-06: on approval unbind the old device FIRST, then bind the new one.
  // Order is a business rule (BR3, BR4), not an implementation detail, so the
  // audit line records each half separately.
  if (item.opKey === "deviceChange" && cust && item.formData["New Device Name"]) {
    const old = cust.devices.length ? devSorted(cust.devices)[0] : null;
    if (old) cust.devices = cust.devices.filter(d => d !== old);
    cust.devices.unshift({ name: item.formData["New Device Name"], platform: "Mobile App", status: "Trusted", lastLogin: nowStr(), location: "Registered via Customer Care" });
    item.deviceResult = `old device ${old ? "unbound: " + old.name : "none linked"}; new device bound: ${item.formData["New Device Name"]}`;
    trace("profile", `Device binding updated: ${item.deviceResult}`);
    audit("EXECUTE", `${item.formData["Request Reference No."] || item.id}: ${item.deviceResult}`, { cif: item.cif });
  }
  if (item.opKey === "invalidSms") {
    // CCW-ISN-01 AC8: on approval, search every customer record for the
    // complainant's mobile number and remove the matches. AC9: when the caller
    // is tagged BANK CUSTOMER, their OWN record is protected. Without that
    // carve-out this operation would delete the contact number of the very
    // person who called in to complain.
    const ref = item.formData["Request Reference No."] || item.id;
    const target = (item.formData["Caller Mobile Number"] || "").replace(/\D/g, "");
    const protectedCif = item.formData["Caller Tag"] === "BANK CUSTOMER" ? (item.formData["CIF Number"] || "").trim() : "";
    const matched = target ? CUSTOMERS.filter(c => (c.mobile || "").replace(/\D/g, "") === target) : [];
    const removed = [], kept = [];
    for (const h of matched) {
      if (protectedCif && h.cif === protectedCif) {
        kept.push(h);
        h.notes.unshift({ date: nowStr(), detail: `Invalid SMS Notification ${ref}: caller is tagged BANK CUSTOMER, so their own registered mobile number was retained (AC9).` });
        continue;
      }
      h.notes.unshift({ date: nowStr(), detail: `Mobile number removed: matched Invalid SMS Notification ${ref}. Previous number: ${h.mobile}.` });
      h.mobile = "—";
      removed.push(h);
    }
    item.removalResult = `${removed.length} record(s) had the mobile number removed${kept.length ? `, ${kept.length} protected as BANK CUSTOMER` : ""}`;
    audit("EXECUTE", `${ref}: search matched ${matched.length} record(s). ${item.removalResult}`, { cif: removed.length ? removed.map(h => h.cif).join("/") : item.cif });
    trace("profile", `ISN removal: ${item.removalResult}`);
  }
  if (item.opKey === "invalidEmail") {
    // CCW-IEN-01 AC10 and AC11: same shape as ISN, on the email address.
    const ref = item.formData["Request Reference No."] || item.id;
    const t = (item.formData["Caller Email Address"] || "").toLowerCase();
    const protectedCif = item.formData["Caller Tag"] === "BANK CUSTOMER" ? (item.formData["CIF Number"] || "").trim() : "";
    const matched = t ? CUSTOMERS.filter(c => (c.email || "").toLowerCase() === t) : [];
    const removed = [], kept = [];
    for (const h of matched) {
      if (protectedCif && h.cif === protectedCif) {
        kept.push(h);
        h.notes.unshift({ date: nowStr(), detail: `Invalid Email Notification ${ref}: caller is tagged BANK CUSTOMER, so their own email address was retained (AC11).` });
        continue;
      }
      h.notes.unshift({ date: nowStr(), detail: `Email address removed: matched Invalid Email Notification ${ref}. Previous email: ${h.email}.` });
      h.email = "—";
      removed.push(h);
    }
    item.removalResult = `${removed.length} record(s) had the email address removed${kept.length ? `, ${kept.length} protected as BANK CUSTOMER` : ""}`;
    audit("EXECUTE", `${ref}: search matched ${matched.length} record(s). ${item.removalResult}`, { cif: removed.length ? removed.map(h => h.cif).join("/") : item.cif });
    trace("profile", `IEN removal: ${item.removalResult}`);
  }
  // CCW-SVC-05: online access off, every device de-registered, accounts left
  // alone. AC7 also stops other in-flight servicing from running against a
  // profile that no longer exists.
  if (item.opKey === "deleteOnline" && cust) {
    const p = onlineProfile(cust);
    const devCount = cust.devices.length;
    p.status = "Inactive";
    cust.devices = [];
    challengeQuestion(cust).set = false;
    const stranded = state.pendingOps.filter(o => o.cif === item.cif && o.id !== item.id && (o.status === "PENDING" || o.status === "AWAITING_CUSTOMER" || o.status === "PENDING_CUSTOMER_ACTION"));
    stranded.forEach(o => {
      o.status = "CANCELLED"; o.decided = nowStr();
      o.remark = `Cancelled: online profile ${p.id} was deleted by ${item.id}, so this request cannot run (AC7).`;
    });
    cust.notes.unshift({ date: nowStr(), detail: `Online banking access removed. Profile ${p.id} set Inactive, ${devCount} device(s) de-registered. Accounts, balances and cards are not affected. Reactivation requires the separate online activation journey (${item.id}).` });
    item.deleteResult = `profile ${p.id} Inactive, ${devCount} device(s) de-registered${stranded.length ? `, ${stranded.length} in-flight request(s) cancelled` : ""}`;
    trace("profile", `Online profile delete: ${item.deleteResult}`);
    audit("EXECUTE", `${item.formData["Request Reference No."] || item.id}: ${item.deleteResult}`, { cif: item.cif });
  }
  // CCW-SVC-07: clear the challenge question. The answer itself is never read,
  // shown or logged (NFR-S1), so there is nothing here that touches it.
  if (item.opKey === "resetChallenge" && cust) {
    const q = challengeQuestion(cust);
    q.set = false; q.reset = nowStr();
    cust.notes.unshift({ date: nowStr(), detail: `Challenge Question reset. The customer must set it up again through the normal channel process (${item.id}).` });
    trace("profile", "Challenge question cleared on the channel credential store");
    audit("EXECUTE", `${item.formData["Request Reference No."] || item.id}: challenge question information reset to zero. Answers are excluded from audit by NFR-S1.`, { cif: item.cif });
  }
  // CCW-OAA-01 AC10: L2 CRU approval activates online status.
  if (item.opKey === "onlineActivation" && cust) {
    const p = onlineProfile(cust);
    p.status = "Active";
    cust.notes.unshift({ date: nowStr(), detail: `Online Access Activation completed by L2 CRU. Profile ${p.id} is Active and the customer can transact online (${item.id}).` });
    trace("profile", `Online profile ${p.id} activated`);
    audit("EXECUTE", `${item.formData["Request Reference No."] || item.id}: online status activated for ${p.id}`, { cif: item.cif });
  }
  // CCW-SVC-02: no customer data changes, the whole effect is one email to the
  // configured business group mailbox.
  if (item.opKey === "hotLead") {
    trace("notify", `Hot Lead email sent to ${item.formData["Business Group Email"]}`);
    audit("EXECUTE", `Hot Lead emailed to ${item.formData["Business Group Email"]}: product ${item.formData["Product Interest"]}, agent ${item.makerId}, CIF ${item.cif}. Customer record unchanged.`, { cif: item.cif });
  }
  if ((item.opKey === "blockCard" || item.opKey === "unblockCard") && cust) {
    const card = cust.cards.find(cd => item.formData["Card"] && item.formData["Card"].includes(cd.no.slice(-4)));
    if (card) {
      card.status = item.opKey === "unblockCard" ? "Active" : "Blocked";
      card.reasonCode = item.formData["Reason Code"] || card.reasonCode;
      pushCardTrail(card, card.status, item.formData["Reason Code"] || "—");
      trace(card.type === "Credit" ? "creditCards" : "debitCards", `Card status → ${card.status}`);
    }
  }
  if (item.opKey === "serviceRequest" && cust) {
    cust.tickets.unshift({
      id: "ZD-" + (48400 + state.opSeq), title: item.formData["Title"] || item.op,
      channel: item.formData["Channel"] || "Voice", status: "Open", datetime: nowStr(),
      agent: item.maker.split(" ")[0], tag: "Service", priority: "Medium",
      ic: item.formData["Interaction Code"] || "Request › General", branch: null,
      conversations: [{ who: `Agent (${item.maker.split(" ")[0]})`, when: nowStr(), text: item.formData["Description"] || "" }],
    });
    trace("zendesk", "Ticket created via Zendesk REST API");
  }
  // COP (Cooling-Off Period, BNM): change transaction limit / phone number /
  // device triggers a 24h cooling-off on the customer (Jacky 21 Jul)
  const opDef = OPS_CATALOGUE[item.opKey] || {};
  const copField = opDef.cop === "field" && item.formData.changes &&
    Object.keys(item.formData.changes).some(f => (DETAILS_UPDATE_FIELDS.find(x => x.name === f) || {}).cop === true);
  const copTriggered = opDef.cop === true || copField;
  if (copTriggered && cust) {
    cust.cop = "Yes (remaining 24h 0m)";
    cust.notes.unshift({ date: nowStr(), detail: `COP (Cooling-Off Period) started — triggered by ${item.op} (${item.id}). High-risk transactions restricted for 24 hours.` });
    trace("profile", `COP started — ${item.op}`);
  }
  audit("EXECUTE", `${item.op} executed — ${item.summary}`, { cif: item.cif });
  if (item.opKey === "auditExport") {
    notify(`${item.id} · Audit export approved — CSV ready for ${item.maker}`);
  } else if (item.opKey === "hotLead") {
    // the recipient is the business group, not the customer (CCW-SVC-02 BR1)
    notify(`${item.id} · Hot Lead sent to ${item.formData["Business Group Email"]}. No approval required.`);
  } else if (opDef.noCustNotify) {
    // P-08: no customer notification; post-notify supervisor instead
    notify(`${item.id} · ${item.op} executed — ${opDef.postNotify || "Supervisor"} post-notified (no customer notification)`);
    audit("EXECUTE", `${opDef.postNotify || "Supervisor"} post-notification sent for ${item.op} (${item.id})`, { cif: item.cif });
  } else {
    trace("notify", `Customer notified: ${item.op} completed`);
    notify(`${item.id} · ${item.op} executed`);
  }
}

// ── Colour theme (Hatta, 31 Jul 2026) ──────────────────────────────────────
// Themes are a variable swap in CSS, applied by setting data-theme on the root
// element. The choice is per user and survives a reload, because an accessible
// theme that resets on every sign-in is not an accessibility feature.
// "system" follows the operating system's light or dark setting.
const THEMES = [
  { id: "system",   label: "Follow system", note: "Light or dark, as the workstation is set" },
  { id: "light",    label: "Bank Islam light", note: "Default" },
  { id: "dark",     label: "Bank Islam dark", note: "Low light" },
  { id: "cvd-rg",   label: "Colour-safe: red-green", note: "Deuteranopia and protanopia. Chrome moves to blue" },
  { id: "cvd-by",   label: "Colour-safe: blue-yellow", note: "Tritanopia" },
  { id: "contrast", label: "High contrast", note: "Low vision, or glare at a branch counter" },
];
const THEME_KEY = "c360p.theme";

function currentTheme() {
  try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return state.theme || "system"; }
}

function applyTheme(id) {
  const t = id || currentTheme();
  const root = document.documentElement;
  if (t === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);
  state.theme = t;
}

function setTheme(id) {
  try { localStorage.setItem(THEME_KEY, id); } catch (e) { /* private mode: session only */ }
  applyTheme(id);
  const t = THEMES.find(x => x.id === id);
  // an accessibility preference is a real setting, so it is audited like one
  audit("WRITE", `Colour theme set to "${t ? t.label : id}"`, { module: "platform" });
  notify(`Theme: ${t ? t.label : id}`);
  render();
}

// ── Session timeout (Jacky, 30 Jul 2026) ───────────────────────────────────
// 30 minutes of inactivity ends the session. Any interaction resets the clock;
// the countdown only becomes visible in the last two minutes, so an agent on a
// long call sees a warning rather than losing the screen without notice.
const SESSION_TIMEOUT_MIN = 30;
const SESSION_WARN_SEC = 120;

function touchSession() { state.lastActivity = Date.now(); }
function sessionSecondsLeft() {
  if (!state.user || !state.lastActivity) return SESSION_TIMEOUT_MIN * 60;
  return Math.max(0, Math.round(SESSION_TIMEOUT_MIN * 60 - (Date.now() - state.lastActivity) / 1000));
}
function expireSession() {
  audit("AUTH", `Session expired after ${SESSION_TIMEOUT_MIN} minutes of inactivity: automatic sign-out`);
  state.user = null; state.customer = null; state.moduleView = null;
  state.subTab = null; state.opDraft = {}; state.modal = null;
  state.sessionExpired = true;
  render();
}
function sessionTick() {
  if (!state.user) return;
  const left = sessionSecondsLeft();
  if (left <= 0) { expireSession(); return; }
  // Re-render only while the warning is on screen. Rendering rebuilds the page
  // from state, so a periodic render would wipe half-typed form input.
  if (left <= SESSION_WARN_SEC) render();
}

// ── Data protection controls (Jacky, 30 Jul 2026) ──────────────────────────
// Copy out is blocked, paste in is allowed, and screen capture is deterred.
//
// Read this before believing the screen: a web page CANNOT prevent a screenshot.
// The operating system takes the picture and the browser is never told. What is
// implemented here is deterrence and traceability, not prevention:
//   - every screen carries a watermark with the staff ID and timestamp, so a
//     leaked image identifies who took it
//   - content is blurred whenever the window loses focus, which defeats the
//     common snip-while-switching flow and OS capture overlays
//   - printing is blocked, and a PrintScreen keypress is audited
// Actual prevention needs endpoint DLP, VDI or MDM policy on the agent desktop.
// The same limit applies to copy: this stops the copy gesture, not a determined
// user with developer tools. Both are recorded as SECURITY audit events.
function blockDataEgress(kind, e) {
  if (e) e.preventDefault();
  audit("SECURITY", `${kind} blocked: copying customer data out of C360P is not permitted`, { module: "platform" });
  // no render() here: it would rebuild the page and discard whatever the agent
  // has typed into an open servicing form
  notify(`${kind} is disabled in C360P. Paste into C360P still works.`);
}

function isEditable(el) {
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
}

function installGuards() {
  ["click", "keydown", "mousedown", "scroll", "touchstart"].forEach(ev =>
    document.addEventListener(ev, touchSession, { passive: true }));
  setInterval(sessionTick, 5000);
  touchSession();

  document.addEventListener("copy", e => blockDataEgress("Copy", e));
  document.addEventListener("cut", e => blockDataEgress("Cut", e));
  document.addEventListener("dragstart", e => e.preventDefault());
  document.addEventListener("contextmenu", e => { if (!isEditable(e.target)) e.preventDefault(); });
  // paste is deliberately NOT blocked: the agent must be able to paste a CIF,
  // a phone number or an SMS body into a form
  document.addEventListener("keydown", e => {
    if (e.key === "PrintScreen") {
      audit("SECURITY", "Screen capture key pressed. The page cannot block the capture; this event is recorded so the image is traceable.", { module: "platform" });
      notify("Screen capture is not permitted. This attempt has been logged.");
    }
  });
  window.addEventListener("beforeprint", () => {
    audit("SECURITY", "Print attempt blocked", { module: "platform" });
  });
  const shield = (on) => document.body.classList.toggle("shielded", on);
  window.addEventListener("blur", () => shield(true));
  window.addEventListener("focus", () => shield(false));
  document.addEventListener("visibilitychange", () => shield(document.hidden));
}

// ── notification module ──
function notify(msg) { state.notifications.unshift({ time: nowStr(), msg }); }

// ── customer360 module: global search ──
// Per use case CCW-C360-SF (Confluence, 17 Jul): exact match, no wildcards, one
// criteria at a time. Multiple records (e.g. multiple CIF records for one
// NRIC) → listing view (AC7). Name search removed — not in the use case.
//
// "All" removed and Card No. added (Faie, 28 Jul 2026). "All" had to go before
// per-criteria format validation was possible: with a combined search there is
// no way to say whether "abc123" is a malformed IC or a malformed email, so the
// only message available was "No records found" — which tells the agent the
// customer does not exist when in fact the input was never valid.
// Customer Name added back (Jacky, 30 Jul 2026, after the session with Nisha
// and Solha). It is the one criteria that is NOT an exact-match lookup: a name
// is typed from what the caller says, so it ranks candidates instead of
// resolving to one record. Everything else stays exact.
const SEARCH_CRIT = ["NRIC", "Customer Name", "Mobile No.", "Account Number", "CIF No.", "Card No.", "Email"];
const NAME_RESULT_LIMIT = 10;

// Format gate per criteria. Runs before any record lookup so a badly formed
// value returns a format error, not a not-found error — two different problems
// for the agent, needing two different messages.
// NRIC is 12 digits; dashes optional, so "810307-10-4455" (14 characters) and
// "810307104455" are both accepted and anything else is rejected.
const CRIT_FORMAT = {
  "NRIC":           { test: v => /^\d{12}$/.test(v.replace(/[-\s]/g, "")),
                      msg: "IC number format is not correct. Numbers only, 12 digits. Example: 810307-10-4455 or 810307104455." },
  "Mobile No.":     { test: v => /^\d{10,11}$/.test(v.replace(/[-\s+]/g, "")),
                      msg: "Mobile number format is not correct. Numbers only, 10 or 11 digits. Example: 012-345 6789." },
  "Account Number": { test: v => /^\d{14}$/.test(v.replace(/[-\s]/g, "")),
                      msg: "Account number format is not correct. Numbers only, 14 digits. Example: 12052010012345." },
  "CIF No.":        { test: v => /^\d{8}$/.test(v.replace(/[-\s]/g, "")),
                      msg: "CIF number format is not correct. Numbers only, 8 digits. Example: 10023456." },
  "Card No.":       { test: v => /^\d{16}$/.test(v.replace(/[-\s]/g, "")),
                      msg: "Card number format is not correct. Numbers only, 16 digits. Example: 4556-8800-1234-1234." },
  "Email":          { test: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),
                      msg: "Email format is not correct. It must contain @ and a domain. Example: nor.azlina@example.com." },
  "Customer Name":  { test: v => /^[A-Za-z@'\/.\- ]{2,}$/.test(v),
                      msg: "Customer name must be at least 2 letters and cannot contain digits. Example: Ahmad Ali." },
};

// input hint per criteria — shown in the field so the format is stated before
// the agent types, not only after a rejection
const CRIT_HINT = {
  "NRIC": "e.g. 810307-10-4455 (12 digits)",
  "Mobile No.": "e.g. 012-345 6789 (10 or 11 digits)",
  "Account Number": "e.g. 12052010012345 (14 digits)",
  "CIF No.": "e.g. 10023456 (8 digits)",
  "Card No.": "e.g. 4556-8800-1234-1234 (16 digits)",
  "Email": "e.g. nor.azlina@example.com",
};

// host transaction behind each criteria — drives the trace drawer
const CRIT_TRACE = { "NRIC": "searchByIC", "Card No.": "debitCards" };

function globalSearch(q, crit) {
  q = (q || "").trim(); crit = crit || SEARCH_CRIT[0];
  if (!q) return { error: "Please enter a search criteria." };
  if (/[*%?]/.test(q)) return { error: "Wildcard characters (*, %, ?) are not accepted in any search criteria field." };
  const fmt = CRIT_FORMAT[crit];
  if (fmt && !fmt.test(q)) return { error: fmt.msg, format: true };
  if (crit === "Customer Name") return nameSearch(q);
  const norm = q.replace(/[-\s]/g, "");
  const qmail = q.toLowerCase();
  const matches = CUSTOMERS.filter(c => {
    switch (crit) {
      case "NRIC":           return c.nric.replace(/-/g, "") === norm;
      case "Mobile No.":     return c.mobile.replace(/-/g, "") === norm;
      case "Account Number": return c.accounts.some(a => a.no === norm);
      case "CIF No.":        return c.cif === norm;
      case "Card No.":       return c.cards.some(cd => cd.no.replace(/[-\s]/g, "") === norm);
      case "Email":          return (c.email || "").toLowerCase() === qmail;
      default:               return false;
    }
  });
  if (!matches.length) return { error: "No records found. Please verify the search criteria and try again." };
  trace(CRIT_TRACE[crit] || "searchByCIF", `Query "${q}" (${crit}) → ${matches.length} result(s)`);
  if (matches.length === 1) { trace("vulnerability"); trace("pdpa"); return { customer: matches[0] }; }
  return { matches, q };
}

// Name search ranking (Jacky, 30 Jul 2026). Three tiers, in this order:
//   0 exact    the name is the keyword, or the keyword is every word of it
//   1 prefix   the name starts with the keyword ("Ahmad Ali" finds "Ahmad Alias")
//   2 contains the keyword appears anywhere else ("Ahmad Ali" finds "Wan Ahmad Ali")
// Ties break alphabetically so the same query always returns the same order.
// Top 10 only: the tail of a contains-match on a common Malay name is noise,
// and an agent who cannot find the customer in ten rows should add a criteria.
const NAME_RANKS = ["Exact", "Prefix", "Contains"];
function nameRank(name, keyword) {
  const n = name.toLowerCase().replace(/\s+/g, " ").trim();
  const k = keyword.toLowerCase().replace(/\s+/g, " ").trim();
  if (n === k) return 0;
  if (n.startsWith(k + " ") || n.startsWith(k)) return 1;
  if (n.includes(k)) return 2;
  return 3;
}
function nameSearch(q) {
  const scored = CUSTOMERS
    .map(c => ({ c, rank: nameRank(c.name, q) }))
    .filter(x => x.rank < 3)
    .sort((a, b) => a.rank - b.rank || a.c.name.localeCompare(b.c.name));
  if (!scored.length) return { error: "No customer name matches that keyword. Check the spelling with the caller, or search by NRIC or CIF." };
  trace("profile", `Name search "${q}": ${scored.length} match(es), showing top ${Math.min(scored.length, NAME_RESULT_LIMIT)}`);
  return {
    q,
    matches: scored.slice(0, NAME_RESULT_LIMIT).map(x => x.c),
    ranks: scored.slice(0, NAME_RESULT_LIMIT).map(x => NAME_RANKS[x.rank]),
    total: scored.length,
    byName: true,
  };
}

function openCustomer(c) {
  // record per-user recently-viewed (top 10, dedupe, newest first)
  if (state.user) {
    const rv = RECENT_VIEWS[state.user.id] || (RECENT_VIEWS[state.user.id] = []);
    const i = rv.findIndex(x => x.cif === c.cif);
    if (i >= 0) rv.splice(i, 1);
    rv.unshift({ cif: c.cif, time: nowStr() });
    if (rv.length > 10) rv.pop();
  }
  state.customer = c; state.tab = "overview"; state.subTab = null; state.moduleView = null;
  state.selAccount = null; state.selCard = null; state.selTxn = null; state.selTicket = null;
  state.unmasked = {};
  trace("profile", `Profile aggregation for CIF ${c.cif}`);
  trace("acctSummary");
  // PDPA principle 3: viewing customer data is a logged read event
  audit("READ", `Customer 360 profile viewed — CIF ${c.cif} (${c.name})`, { cif: c.cif });
}

// ── masking (DD: masked per masking policy; unmask = justified, logged) ──
function mask(val, kind) {
  if (val == null || val === "—") return "—";
  const s = String(val);
  if (kind === "nric") return s.slice(0, 6) + "-XX-XXXX";
  if (kind === "acct") return s.slice(0, 4) + "XXXXXX" + s.slice(-4);
  if (kind === "card") return s.slice(0, 4) + "-XXXX-XXXX-" + s.slice(-4);
  if (kind === "mobile") return s.slice(0, 3) + "XXXX" + s.slice(-2);
  if (kind === "email") { const i = s.indexOf("@"); return i < 0 ? "XXX" : s[0] + "XXXX" + s.slice(i); }
  return s;
}

// inline SVG eye — proper icon, not emoji (Atie)
// NOTE: closing tag escaped with backslash — live-server's reload injection
// targets the first literal closing svg/body/head tag it finds, even inside
// JS strings or comments, and splices its script there, breaking the page.
// Never write a raw closing tag for those three elements anywhere in src/.
const EYE_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><\/svg>`;

// red clock icon for COP markers (SVG so it can be tinted — emoji cannot)
const CLOCK_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><\/svg>`;
const COP_BADGE = `<span title="Triggers 24-hour Cooling-Off Period (BNM)" style="cursor:help;color:var(--bad);font-weight:700;white-space:nowrap">${CLOCK_ICON} COP</span>`;

function maskedField(key, val, kind) {
  if (state.unmasked[key]) return esc(val);
  return `${esc(mask(val, kind))} <button class="unmask" onclick="askUnmask('${key}')" title="Unmask — justification required">${EYE_ICON}</button>`;
}

function askUnmask(key) {
  askText("Unmask field", "Unmask is a logged action (PDPA). Enter justification:", (just) => {
    state.unmasked[key] = true;
    audit("UNMASK", `Field unmasked: ${key}`, { just });
  });
}

// modal text input (prompt() is blocked in sandboxed pages)
function askText(title, label, cb) {
  state.modal = `<div class="overlay" onclick="if(event.target===this){state.modal=null;render()}">
    <div class="modal"><h3>${esc(title)}</h3><label>${esc(label)}</label>
    <input id="askTextInput" autofocus>
    <div class="task-actions">
      <button class="btn primary" id="askTextOk">Confirm</button>
      <button class="btn ghost" onclick="state.modal=null;render()">Cancel</button>
    </div></div></div>`;
  state._askCb = cb;
  render();
  const ok = document.getElementById("askTextOk");
  const inp = document.getElementById("askTextInput");
  const done = () => {
    const v = inp.value.trim();
    if (!v) { inp.style.borderColor = "var(--bad)"; return; }
    state.modal = null; const cb2 = state._askCb; state._askCb = null;
    cb2(v); render();
  };
  ok.onclick = done;
  inp.onkeydown = (e) => { if (e.key === "Enter") done(); };
  inp.focus();
}

// Customer activity: seeded for narrative customers; synthesized from
// transaction history + last login for generated ones (lazy, cached).
function getCustActivity(c) {
  if (CUST_ACTIVITY[c.cif]) return CUST_ACTIVITY[c.cif];
  const rows = [];
  if (c.lastLogin && c.lastLogin !== "—") {
    const dev = c.devices[0];
    rows.push({ time: c.lastLogin, action: "Login", channel: "Mobile App", detail: `Successful login — ${dev ? dev.name + " (" + dev.status + "), " + dev.location : "registered device"}`, module: "customer360" });
  }
  for (const a of c.accounts) for (const t of (TXN[a.no] || [])) {
    rows.push({ time: t.dt, action: t.cat, channel: t.channel, detail: `${t.desc} — ${t.debit ? "RM " + t.debit.toLocaleString("en-MY", {minimumFractionDigits: 2}) : "RM " + (t.credit || 0).toLocaleString("en-MY", {minimumFractionDigits: 2})} (${t.ref})`, module: "casaia" });
  }
  for (const cd of c.cards) for (const t of (CARD_TXN[cd.no] || [])) {
    rows.push({ time: t.dt, action: t.type === "Payment" ? "Card Payment" : "Card Purchase", channel: "Card", detail: `${t.merchant} — ${t.ccy} ${Math.abs(t.amt).toLocaleString("en-MY", {minimumFractionDigits: 2})} (${t.ref})`, module: "cards" });
  }
  for (const tk of c.tickets) rows.push({ time: tk.datetime, action: "Contact", channel: tk.channel, detail: `${tk.title} (${tk.id})`, module: "cases" });
  CUST_ACTIVITY[c.cif] = rows;
  return rows;
}

// Addresses are held as one flat line per type. The update screen edits them as
// five parts, so split on the way out and recompose on the way in. The parser is
// positional: "<line 1>, <line 2…>, <postcode> <city>, <state>".
// ponytail: positional parse, good enough for a prototype — the real build reads
// the structured address fields straight off CBS.
function splitAddr(s) {
  const p = String(s || "").split(",").map(x => x.trim()).filter(Boolean);
  const st = p.length > 1 ? p.pop() : "";
  const cityPart = p.length > 1 ? p.pop() : "";
  const m = cityPart.match(/^(\d{5})\s+(.+)$/);
  return { l1: p[0] || "", l2: p.slice(1).join(", "), city: m ? m[2] : cityPart, state: st, postcode: m ? m[1] : "" };
}
function joinAddr(a) {
  return [a.l1, a.l2, [a.postcode, a.city].filter(Boolean).join(" "), a.state].filter(Boolean).join(", ");
}
function addrParts(c, type) {
  const row = custAddresses(c).find(r => r.type === type);
  return splitAddr(row ? row.addr : "");
}
// Which address type and part each editable address field maps to.
const ADDR_FIELD_MAP = {
  "Residential Address 1": ["Residential", "l1"], "Residential Address 2": ["Residential", "l2"],
  "Residential City": ["Residential", "city"], "Residential State": ["Residential", "state"],
  "Residential Postcode": ["Residential", "postcode"],
  "Office Address 1": ["Office", "l1"], "Office Address 2": ["Office", "l2"],
  "Office City": ["Office", "city"], "Office State": ["Office", "state"],
  "Office Postcode": ["Office", "postcode"],
};

// Current value per Update Customer Information field — mapped from customer
// data where the prototype holds it; free-form fields persist in c.detailsExtra.
function getDetailValue(c, fld) {
  const am = ADDR_FIELD_MAP[fld];
  if (am) return addrParts(c, am[0])[am[1]] || "–";
  if ((c.detailsExtra || {})[fld] != null) return c.detailsExtra[fld];
  switch (fld) {
    case "Customer Name": return c.name;
    case "CIF / Customer ID": return c.cif;
    case "NRIC / Passport": return c.nric;
    case "Vulnerability Status": return c.vulnerability;
    case "OKU Number": { const m = (c.vulnerability || "").match(/OKU[^A-Za-z0-9]*([A-Za-z0-9\/-]+)/); return m ? m[1] : "–"; }
    case "Customer Segment": return c.lob;
    case "Customer Class": return c.class;
    case "FATCA Status": return c.fatca;
    case "Phone No3 (H/P)": return c.mobile;
    case "Email Address": return c.email;
    case "COP Status": return c.cop;
    case "Kill Switch Status": return c.killswitch;
    case "Staff Tagging": return c.staffTag;
    case "PDPA Consent": return c.pdpa;
    case "Date of Birth": return c.dob;
    case "Relationship Commencement": return c.commencement;
    case "Account Opening Branch": return c.locationBranch;
    case "Active Products": return String(c.activeProducts);
    case "Inactive Products": return String(c.inactiveProducts);
    case "Last Login": return c.lastLogin;
    case "Relationship Since": return `${c.relationshipSince} (${c.relationshipDur})`;
    case "Country of Citizenship": return c.citizenship;
    default: return "–";
  }
}

// Addresses per CIF (Atie 24 Jul) — typed list; fallback for customers
// without a seeded set. Account/card screens derive their related subset.
function custAddresses(c) {
  return (c.addresses && c.addresses.length) ? c.addresses : [
    { type: "Residential", addr: c.address },
    { type: "Mailing", addr: c.address },
  ];
}
// Customer Details shows Residential and Office only (Faie, 28 Jul 2026).
// Mailing/Business addresses stay in the data and are still used by the account
// and card screens — this is a display filter, not a data change.
const CUST_DETAIL_ADDR = ["Residential", "Office"];
function custDetailAddresses(c) {
  const rows = custAddresses(c).filter(r => CUST_DETAIL_ADDR.includes(r.type));
  // every CIF has a residential address; fall back to the flat field if the
  // typed list carries neither type (generated customers)
  return rows.length ? rows : [{ type: "Residential", addr: c.address }];
}

function acctAddresses(c, a) {
  const all = custAddresses(c);
  const mailing = all.find(x => x.type === "Mailing" || x.type === "Business") || all[0];
  return [
    { type: "Statement / Mailing", addr: a.stmtAddr || mailing.addr },
    { type: "Account Holder Residential", addr: (all.find(x => x.type === "Residential") || all[0]).addr },
  ];
}
function cardAddresses(c, cd) {
  const all = custAddresses(c);
  const res = (all.find(x => x.type === "Residential") || all[0]).addr;
  const mailing = (all.find(x => x.type === "Mailing" || x.type === "Business") || all[0]).addr;
  return [
    { type: "Billing Address", addr: cd.billingAddr || res },
    { type: "Card Delivery Address", addr: cd.deliveryAddr || mailing },
  ];
}

// ── helpers ──
// Date format dd/mm/yyyy across the app (Izza, 24 Jul)
function nowStr() {
  const d = new Date();
  let h = d.getHours(); const am = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}, ${String(h).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}${am}`;
}
const MONTH_NUM = { Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12" };
// display-layer conversion: "16 Jul 2026" → "16/07/2026" (seed data untouched)
function fmtDates(s) {
  return s.replace(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})\b/g,
    (_, d, m, y) => `${d.padStart(2,"0")}/${MONTH_NUM[m]}/${y}`)
    .replace(/(\d{1,2}:\d{2}) (AM|PM)\b/g, "$1$2");   // "10:00 PM" → "10:00PM" (Atie)
}
function rm(v) {
  if (v == null) return "—";
  const sign = v < 0 ? "-" : "";
  return sign + "RM " + Math.abs(v).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s) { return fmtDates(String(s == null ? "—" : s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function statusPill(s) {
  const good = ["Active","Posted","Solved","Delivered","EXECUTED","Trusted","Open Active"];
  const warn = ["Dormant","Pending","Authorised","PENDING","AWAITING_CUSTOMER","PENDING_CUSTOMER_ACTION","Under Investigation","Open"];
  const bad  = ["Blocked","Suspended","Failed","Reversed","REJECTED","CANCELLED","Unrecognised","Closed"];
  const cls = good.includes(s) ? "ok" : warn.includes(s) ? "warn" : bad.includes(s) ? "bad" : "";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

// ── Prototype-only: test data picker ───────────────────────────────────────
// The same affordance as the sign-in account picker, for the same reason: a
// reviewer cannot test a search without knowing a value that exists. Twenty
// customers, chosen to cover the cases worth testing rather than the first
// twenty in the seed. In the real product this panel does not exist.
function testCustomers() {
  if (state._testSet) return state._testSet;
  const out = [], seen = new Set();
  const add = (c, why) => { if (c && !seen.has(c.cif) && out.length < 20) { seen.add(c.cif); out.push({ c, why }); } };
  const byName = (n) => CUSTOMERS.find(c => c.name === n);

  // name search, the three ranking tiers
  add(byName("AHMAD ALI"), "Name: exact match");
  add(byName("AHMAD ALIAS BIN OSMAN"), "Name: prefix match");
  add(byName("WAN AHMAD ALI BIN ZAKARIA"), "Name: contains match");

  // two records on one NRIC and one mobile: search returns a listing, not a record
  const dupNric = CUSTOMERS.filter(c => CUSTOMERS.filter(x => x.nric === c.nric).length > 1);
  add(dupNric[0], "Shares NRIC and mobile with the next row");
  add(dupNric[1], "Second record on the same NRIC");

  // Flagged profiles, each changing what the servicing screens do. addFirst
  // skips candidates already picked, otherwise a customer carrying two flags
  // swallows both slots and the panel fills up with duplicates.
  const addFirst = (pred, why) => add(CUSTOMERS.find(c => !seen.has(c.cif) && pred(c)), why);
  addFirst(c => c.staffTag === "Yes", "Staff-tagged: services are refused");
  addFirst(c => c.killswitch === "Yes", "Kill switch already active");
  addFirst(c => c.cop && c.cop.startsWith("Yes"), "Cooling-off period running");
  addFirst(c => c.vulnerability !== "No", "Vulnerable customer");
  addFirst(c => c.riskScore === "High Risk", "High risk");
  addFirst(c => c.status !== "Active", "Not Active");
  addFirst(c => c.lastLogin === "—" && c.staffTag !== "Yes", "Never signed in: nothing to delete");
  addFirst(c => c.devices.length >= 4, "Several devices: Device Details listing");
  addFirst(c => c.cards.some(cd => cd.type === "Credit"), "Holds a credit card: Card No. search");
  addFirst(c => c.cards.some(cd => cd.status !== "Active"), "Has a blocked card");
  addFirst(c => (c.addresses || []).some(a => a.type === "Office"), "Residential and office address");
  addFirst(c => c.pdpa === "No", "PDPA consent withheld");
  addFirst(c => c.tickets && c.tickets.length > 0, "Has open case tickets");

  // fill the rest with ordinary records so the panel is not all edge cases
  for (const c of CUSTOMERS) {
    if (out.length >= 20) break;
    if (c.staffTag !== "Yes" && c.status === "Active" && c.cards.length) add(c, "Ordinary record");
  }
  state._testSet = out;
  return out;
}

        if (f === "Channel") return `<label>Channel</label><select id="opf${i}"><option>Voice</option><option>Email</option><option>Live Chat</option><option>Social Media</option><option>Branch</option></select>`;
        return `<label>${esc(f)}</label><input id="opf${i}" placeholder="${esc(f)}">`;
      }).join("")}
      <div class="task-actions">
        <button class="btn primary" onclick="submitOpForm('${opKey}')">Submit${op.level === "L0" ? "" : " for approval"}</button>

}

// Update Customer Information — FULL-SCREEN flow (Faie 21 Jul; field set and
// layout revised by Jacky, 10 Aug 2026). The screen mirrors the Overview tab:
// same two segments, same fields, same order. Fields the agent may change carry
// a pencil; everything else is greyed out so the agent can see the value but not
// touch it. Fields that need a second pair of eyes carry the checker mark.
// Flow: edit screen → confirmation (changed fields only) → maker-checker.
// DB reflects checker-required changes ONLY after the checker approves.
const PENCIL_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/><\/svg>`;
const EDIT_MARK = `<span title="Editable field" style="color:var(--crimson);cursor:help">${PENCIL_ICON}</span>`;
const CHECKER_MARK = `<span title="Requires maker-checker approval before it is written" style="cursor:help;color:var(--ink);font-weight:700;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6Z"/><path d="m9 12 2 2 4-4"/><\/svg> M-C<\/span>`;
const X_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="vertical-align:-2px"><path d="M18 6 6 18M6 6l12 12"/><\/svg>`;

function dupField(name) { return DETAILS_UPDATE_FIELDS.find(x => x.name === name) || { name }; }
function dupNeedsChecker(name) { return dupField(name).checker === true; }

function openDetailsUpdateForm() {

// One row, mirroring the Overview key/value layout. Read-only fields render as
// plain dimmed text — no input at all, so there is nothing to click by mistake.
function dupRow(c, f, d) {
  const cur = getDetailValue(c, f.name);
  const marks = `${f.edit ? " " + EDIT_MARK : ""}${f.checker ? " " + CHECKER_MARK : ""}${f.cop ? " " + COP_BADGE : ""}`;
  if (!f.edit) return `<div class="k">${esc(f.name)}</div><div class="dim ro">${esc(cur)}</div>`;
  const val = d.changes[f.name] || "";
  const input = f.type === "select"
    ? `<select class="dfNew" data-f="${esc(f.name)}"${f.name === "Vulnerability Status" ? ` onchange="dupOkuHint(this.value)"` : ""}>
         <option value="">— no change (${esc(cur)}) —</option>
         ${f.opts.map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}
       </select>`
    : `<input class="dfNew" data-f="${esc(f.name)}" value="${esc(val)}" placeholder="${esc(f.ph || "new value — blank = no change")}">`;
  return `<div class="k">${esc(f.name)}${marks}</div>
    <div class="editable"><span class="fine dim">now: ${esc(cur)}</span>${input}
    ${f.name === "OKU Number" ? `<span class="fine warn-t" id="okuHint" style="display:none">Mandatory when Vulnerability Status is OKU.</span>` : ""}</div>`;
}

// Same segment/sub-heading grouping the Overview uses, driven off the field spec
// so the two screens cannot drift apart.
function dupGroups(c, d) {
  const groups = [];
  for (const f of DETAILS_UPDATE_FIELDS) {
    let g = groups.find(x => x.name === f.group);
    if (!g) groups.push(g = { name: f.group, blocks: [] });
    const key = f.sub || "";
    let b = g.blocks[g.blocks.length - 1];
    if (!b || b.sub !== key) g.blocks.push(b = { sub: key, rows: [] });
    b.rows.push(f);
  }
  return groups.map(g => `<div class="dgroup">
    <h4>${esc(g.name)}</h4>
    ${g.blocks.map(b => `${b.sub ? `<h5 class="sub-h">${esc(b.sub)}</h5>` : ""}
      <div class="kv">${b.rows.map(f => dupRow(c, f, d)).join("")}</div>`).join("")}
  </div>`).join("");
}

function dupOkuHint(v) {

function reviewDetailsUpdate() {
  const changes = {};

    const v = (inp.value || "").trim();

  // already on the record from an earlier update.

  if (vuln && vuln.startsWith("OKU") && !changes["OKU Number"] && getDetailValue(state.customer, "OKU Number") === "–") {

function confirmDetailsUpdate() {
  const c = state.customer;
  const d = state.dupDraft;
  const line = (ch) => Object.entries(ch).map(([f, v]) => `${f}: "${getDetailValue(c, f)}" → "${v}"`).join("; ");
  const pick = (want) => Object.fromEntries(Object.entries(d.changes).filter(([f]) => dupNeedsChecker(f) === want));
  // Jacky's matrix marks Vulnerability Status and ID/Passport dates as not
  // requiring a checker, so those cannot ride on the same approval request as
  // the rest — they are submitted as a direct (L0) update and execute at once.
  const direct = pick(false), checked = pick(true);
  if (Object.keys(direct).length) {
    submitOp("detailsUpdate", line(direct) + " · direct update, no checker required · Justification: " + d.just,
      { changes: direct, Justification: d.just }, { level: "L0" });
  }
  if (Object.keys(checked).length) {
    submitOp("detailsUpdate", line(checked) + " · Justification: " + d.just, { changes: checked, Justification: d.just });
  }
  state.subTab = null; state.dupDraft = null; render();
}

// ── Full-screen servicing forms ────────────────────────────────────────────
// Faie, 28 Jul 2026: every Overview service is a full screen, and every remarks
// box holds at least 500 words. Each form below follows the List of Fields in
// its own Confluence use case, which is why they differ from each other.
//
// Re-render rebuilds the page from state, so any step that re-renders in the
// middle of a form (a search, a residency change) must stash what the agent has
// already typed first. File inputs are the exception: a browser will not let a
// page put a file back into a picker, so re-attaching is required after a step
// that re-renders. That is a prototype limit, not a design.
function stashOpDraft() {
  state.opDraft = state.opDraft || {};
  document.querySelectorAll(".opf").forEach(el => {
    if (el.type === "file") return;
    state.opDraft[el.id] = el.value;
  });
}
function draft(id, dflt) {
  const d = state.opDraft || {};
  return d[id] != null && d[id] !== "" ? d[id] : (dflt != null ? dflt : "");
}
function opRef(prefix) { return `${prefix}-2026-${1000 + state.opSeq}`; }
function opCancel() { state.subTab = null; state.opDraft = {}; state.opError = ""; render(); }
function opErrLine() { return `<p class="fine" style="color:var(--bad)">${esc(state.opError || "")}</p>`; }

function fInput(id, ph, type, dflt) {
  return `<input class="opf" id="${id}"${type ? ` type="${type}"` : ""} value="${esc(draft(id, dflt))}" placeholder="${esc(ph || "")}" style="width:100%">`;
}
function fSelect(id, opts, placeholder, onchange) {
  const cur = draft(id);
  const head = placeholder ? `<option value="">${esc(placeholder)}</option>` : "";
  return `<select class="opf" id="${id}"${onchange ? ` onchange="${onchange}"` : ""}>${head}${
    opts.map(o => `<option${o === cur ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}
function fFile(id, hint) {
  return `<input class="opf-file" id="${id}" type="file"> <span class="fine">${esc(hint || "")}</span>`;
}
function fRow(label, html, req) {
  return `<div class="k">${esc(label)}${req ? ' <span style="color:var(--bad)">*</span>' : ""}</div><div>${html}</div>`;
}

// Remarks box sized for the agent to write the full call story, not a one-liner.
// 500 words is roughly 3,000 characters, so the cap sits well above it.
function remarksBox(id, label, hint) {
  return `<div class="dgroup wide">
    <h4>${esc(label)}</h4>
    <textarea class="opf remarks" id="${id}" rows="9" maxlength="6000" oninput="wordCount('${id}')"
      placeholder="${esc(hint || "")}">${esc(draft(id))}</textarea>
    <div class="fine wc" id="${id}Wc">${wordsIn(draft(id))} words, room for at least 500</div>
  </div>`;
}
function wordsIn(s) { return ((s || "").trim().match(/\S+/g) || []).length; }
function wordCount(id) {
  const el = document.getElementById(id), out = document.getElementById(id + "Wc");
  if (!el || !out) return;
  const n = wordsIn(el.value);
  out.textContent = `${n} word${n === 1 ? "" : "s"}, room for at least 500`;
  out.style.color = n >= 500 ? "var(--ok)" : "";
}

// Simulated SMS / email history for the number or address under investigation.
// Deterministic from the value itself so a walkthrough repeats identically.
const MSG_TEMPLATES = [
  "OTP for online banking login",
  "Transaction alert: debit card purchase",
  "Personal Financing-i campaign",
  "Statement ready notification",
  "Card transaction alert",
];
function msgHistory(value, kind) {
  const seed = (String(value).match(/\d/g) || ["3"]).join("");
  const n = 2 + (Number(seed.slice(-1) || 3) % 3);
  const rows = [];
  for (let i = 0; i < n; i++) {
    const day = 10 + ((Number(seed.slice(-2) || 12) + i * 3) % 15);
    rows.push({
      dt: `${String(day).padStart(2, "0")}/07/2026, ${String(8 + i * 4).padStart(2, "0")}:${String((i * 17) % 60).padStart(2, "0")}`,
      template: MSG_TEMPLATES[(Number(seed.slice(-1) || 0) + i) % MSG_TEMPLATES.length],
      channel: kind === "sms" ? "SMS gateway" : "Email (SES)",
    });
  }
  return rows;
}

function viewISNScreen() {

function oaaSendForm() {
  stashOpDraft();
  const c = state.customer;
  if (draft("oaaEmailOk") !== "Yes") {
    state.opError = "Confirm the registered email address is correct before sending the OAA Form (BR4).";
    render(); return;
  }
  state.opError = "";
  state.opDraft.formSent = true;
  state.opDraft.formSentAt = nowStr();
  trace("notify", `OAA Form emailed to ${c.email}`);
  audit("WRITE", `OAA Form emailed to ${c.email} after email verification`, { cif: c.cif });
  notify(`OAA Form emailed to ${c.email}`);
  render();
}

function submitOAA(ref, park) {
  stashOpDraft();
  const c = state.customer;
  const d = state.opDraft || {};
  const status = draft("oaaFormStatus");
  const remarks = draft("oaaRemarks").trim();
  const passport = fileNameOf("oaaPassport");
  const signed = fileNameOf("oaaForm");
  if (!d.formSent) { state.opError = "Email the OAA Form to the customer before recording the outcome."; render(); return; }
  if (!remarks) { state.opError = "L1 remarks are required."; render(); return; }
  const fd = {
    "Request Reference No.": ref,
    "Customer Name": c.name,
    "Customer ID / CIF": c.cif,
    "Residency Status": "Overseas",
    "Registered email verified": draft("oaaEmailOk"),
    "OAA Form Status": status || "Not received",
    "Passport copy": passport || "not attached",
    "Signed OAA Form": signed || "not attached",
    "L1 Remarks": remarks,
  };
  if (park) {
    state.opError = "";
    submitOp("onlineActivation", `${ref} — waiting for customer documents`, fd, { status: "PENDING_CUSTOMER_ACTION" });
    state.subTab = null; state.opDraft = {}; render(); return;
  }
  if (!passport || !signed) {
    state.opError = "Both the passport copy and the signed OAA Form must be attached before the request goes to L2 CRU (BR5, BR6). Use Mark Pending Customer Action while documents are outstanding.";
    render(); return;
  }
  if (status !== "Received and signed") {
    state.opError = "OAA Form Status must be \"Received and signed\" before submission. Incomplete or unreadable documents stay with L1 (BR6).";
    render(); return;
  }
  state.opError = "";
  submitOp("onlineActivation", `${ref} — documents complete, routed to L2 CRU`, fd);
  state.subTab = null; state.opDraft = {}; render();
}

// A parked request comes back to the maker when the customer sends the missing
// documents. The parked item is dropped and a fresh one is created on submit,
// so the queue never holds two live copies of the same request.
function resumeOAA(id) {
  const item = state.pendingOps.find(o => o.id === id);
  if (!item) return;
  const c = CUSTOMERS.find(x => x.cif === item.cif);
  if (!c) return;
  openCustomer(c);
  state.pendingOps = state.pendingOps.filter(o => o.id !== id);
  state.tab = "overview"; state.subTab = "oaa"; state.opError = "";
  state.opDraft = {
    oaaResidency: "Overseas",
    oaaEmailOk: item.formData["Registered email verified"] || "Yes",
    oaaFormStatus: item.formData["OAA Form Status"],
    oaaRemarks: item.formData["L1 Remarks"],
    formSent: true,
    formSentAt: item.submitted,
  };

function kv(k, vHtml) { return `<div class="k">${k}</div><div>${vHtml}</div>`; }

// Device Overview shows the latest 2 by default, most recent first, with View All
// revealing the rest (P-12, Atie 27 Jul 2026). Seed devices are not stored in
// login order, so sort rather than trust the array.
const DEV_MONTHS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
// Seed data carries two shapes: "16 Jul 2026, 10:12 PM" on the hand-written
// customers and date-only "12 Jul 2026" on the 95 generated ones. Time is optional.
function devTime(s) {
  const m = /^(\d{1,2}) (\w{3}) (\d{4})(?:, (\d{1,2}):(\d{2}) (AM|PM))?$/.exec(s || "");
  if (!m) return 0;                                  // unparseable sorts last
  const h = m[4] ? (+m[4] % 12) + (m[6] === "PM" ? 12 : 0) : 0;
  return Date.UTC(+m[3], DEV_MONTHS.indexOf(m[2]), +m[1], h, +(m[5] || 0));
}
function devSorted(devices) {
  return devices.slice().sort((a, b) => devTime(b.lastLogin) - devTime(a.lastLogin));
}

function addRemark(acctNo) {
  const inp = $("remarkInput"); const text = (inp.value || "").trim();
  if (!text) { inp.style.borderColor = "var(--bad)"; return; }
  const a = state.customer.accounts.find(x => x.no === acctNo);
  if (!a.remarks) a.remarks = [];
  a.remarks.unshift({ when: nowStr(), by: `${state.user.name} (${state.user.unit.split(",")[0]})`, text });
  audit("WRITE", `Remark added on account …${acctNo.slice(-4)}: "${text.slice(0, 80)}"`);
  notify("Remark saved");
  render();
}

function svcValidEmail(v) { return CRIT_FORMAT["Email"].test((v || "").trim()); }

function svcSaveRow(i) {
  const product = ($("hlP" + i).value || "").trim();
  const email = ($("hlE" + i).value || "").trim();
  if (!product) { state.svcError = "Product name cannot be empty."; render(); return; }
  if (!svcValidEmail(email)) { state.svcError = "Business group email format is not correct. Example: cards.sales@bankislam.example."; render(); return; }
  const before = `${HOT_LEAD_PRODUCTS[i].product} → ${HOT_LEAD_PRODUCTS[i].email}`;
  HOT_LEAD_PRODUCTS[i] = { product, email };
  state.svcError = "";
  audit("ACL_CHANGE", `Service Config: Hot Lead routing changed, "${before}" → "${product} → ${email}"`, { module: "platform" });
  notify(`Hot Lead routing saved: ${product}`);
  render();
}

function svcDeleteRow(i) {
  const row = HOT_LEAD_PRODUCTS[i];
  if (HOT_LEAD_PRODUCTS.length === 1) { state.svcError = "At least one product must remain, otherwise Hot Lead has nothing to route."; render(); return; }
  HOT_LEAD_PRODUCTS.splice(i, 1);
  state.svcError = "";
  audit("ACL_CHANGE", `Service Config: Hot Lead product removed, "${row.product} → ${row.email}"`, { module: "platform" });
  notify(`Hot Lead product removed: ${row.product}`);
  render();
}

function svcAddRow() {
  const product = ($("hlPnew").value || "").trim();
  const email = ($("hlEnew").value || "").trim();
  if (!product) { state.svcError = "Enter the product name."; render(); return; }
  if (!svcValidEmail(email)) { state.svcError = "Business group email format is not correct. Example: cards.sales@bankislam.example."; render(); return; }
  HOT_LEAD_PRODUCTS.push({ product, email });
  state.svcError = "";
  audit("ACL_CHANGE", `Service Config: Hot Lead product added, "${product} → ${email}"`, { module: "platform" });
  notify(`Hot Lead product added: ${product}`);
  render();
}

function saveRoleForm(id) {
  const groups = [...document.querySelectorAll(".rfg")].filter(c => c.checked).map(c => c.value);
  const perms = {};
  [...document.querySelectorAll(".rfp")].filter(c => c.checked).forEach(c => {
    const m = c.dataset.m; (perms[m] = perms[m] || []).push(c.dataset.l);
  });
  const res = roleSave(id, {
    name: $("rfName").value.trim(), desc: $("rfDesc").value.trim(),
    groups, perms, status: $("rfStatus").value,
  });
  if (res.error) { const el = $("rfError"); el.textContent = res.error; return; }
  // permission changes reflect immediately for the current session user too
  Object.assign(state.user, resolveAccess(state.user));
  state.modal = null; render();
}

// ── Audit Trail TAB (Atie 17 Jul, v22) — EVERYTHING related to the selected
// customer in one place: staff actions (views, unmasks, servicing, M-C) AND
// the customer's own activity, merged, newest first, tagged by source.
function parseTime(s) {
  // handles both "16 Jul 2026, 09:15 AM" (seed) and "16/07/2026, 09:15 AM"
  let mo, d, y, m = String(s).match(/(\d{1,2}) (\w{3}) (\d{4}),? ?(\d{1,2})?:?(\d{2})? ?(AM|PM)?/);
  if (m) { mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(m[2]); d = m[1]; y = m[3]; }
  else {
    m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),? ?(\d{1,2})?:?(\d{2})? ?(AM|PM)?/);
    if (!m) return 0;
    mo = parseInt(m[2], 10) - 1; d = m[1]; y = m[3];
  }
  let h = parseInt(m[4] || "0", 10); if (m[6] === "PM" && h < 12) h += 12; if (m[6] === "AM" && h === 12) h = 0;
  return new Date(parseInt(y), mo, parseInt(d), h, parseInt(m[5] || "0")).getTime();
}

  return `<section class="card"><h3>Customer Activity <span class="fine">done by the customer · ${esc(MOD_LABELS[moduleKey] || moduleKey)} · latest ${rows.length}</span></h3>
    <div class="tablewrap"><table>
      <tr><th>Date &amp; Time</th><th>Action</th><th>Channel</th><th>Detail</th></tr>
      ${rows.map(a => `<tr><td>${esc(a.time)}</td>
        <td><span class="pill ${a.action.includes("Failed") || a.detail.includes("FLAGGED") || a.detail.includes("unrecognised") || a.detail.includes("Unrecognised") ? "warn" : ""}">${esc(a.action)}</span></td>
        <td>${esc(a.channel)}</td><td>${esc(a.detail)}</td></tr>`).join("")}
    </table></div></section>`;
}

// ── Trace drawer (collapsed by default) ─────────────────────────────────────
function viewTraceDrawer() {
  return `
  <div class="trace ${state.traceOpen ? "open" : ""}">
    <button class="trace-toggle" onclick="state.traceOpen=!state.traceOpen;render()">
      ${state.traceOpen ? "▼ Hide" : "▲"} Request Trace <span class="badge">${state.trace.length}</span>
      <span class="fine">SPA → ALB → c360p-app (modulith) → c360p-host-adapter → SIBS/EBS/ASP · audit ${state.auditLog.length} events</span>
    </button>
    ${state.traceOpen ? `<div class="trace-body">
      <div class="trace-col">
        <h4>Host / integration calls</h4>
        ${state.trace.slice(0, 12).map(t => `<div class="trace-row">
          <b>TC ${esc(t.tc)}</b> ${esc(t.label)} <span class="pill">${esc(t.sys)}</span> <span class="fine">${t.ms} ms · ${esc(t.time)}</span>
          <div class="fine">${esc(t.hops)}${t.extra ? " — " + esc(t.extra) : ""}</div></div>`).join("") || "<p class='fine dim'>No calls yet.</p>"}
      </div>
      <div class="trace-col">
        <h4>Audit log (append-only · WORM S3 archival) — reads are PDPA events</h4>
        ${state.auditLog.slice(0, 12).map(a => `<div class="trace-row">
          <span class="pill ${a.type === "UNMASK" || a.type === "READ" ? "warn" : a.type === "MC_REJECT" ? "bad" : ""}">${esc(a.type)}</span>
          ${esc(a.detail)} <div class="fine">${esc(a.actor)} · CIF ${esc(a.cif)} · ${esc(a.time)}${a.just ? " · justification: " + esc(a.just) : ""}</div></div>`).join("")}
      </div>
    </div>` : ""}
  </div>`;
}

applyTheme();
installGuards();
render();
</script>
